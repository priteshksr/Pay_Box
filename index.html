    async function welcomeSubmit(e) {
      e.preventDefault();
      const form = e.currentTarget;
      const f = new FormData(form);
      const flow = form.dataset.flow || (welcomeUI.role === 'worker' ? 'worker' : 'owner');
      // Prefer the advanced override inputs (power user pasted their own
      // Supabase URL / anon key) over the baked-in defaults.
      const url = ($('#welcomeUrlAdv')?.value || $('#welcomeUrl')?.value || state.cloud.url || DEFAULT_CLOUD.url || '').trim();
      const anonKey = ($('#welcomeKeyAdv')?.value || $('#welcomeKey')?.value || state.cloud.anonKey || DEFAULT_CLOUD.anonKey || '').trim();
      const msg = $('#welcomeMsg');
      const setMsg = (text, tone = 'slate') => {
        const colors = { slate: 'text-slate-500', red: 'text-rose-600', green: 'text-emerald-700', amber: 'text-amber-700' };
        msg.className = `text-xs ${colors[tone]} min-h-[1em]`;
        msg.textContent = text || '';
      };

      if (!url || !anonKey) { setMsg(t('welcome_missing_cloud'), 'red'); return; }

      // ===================== WORKER FLOW =====================
      // Two modes controlled by `data-has-code` on the form:
      //   "1" → first-time: phone + invite code → anonymous sign-in → claim_staff_invite
      //   "0" → returning: phone only → anonymous sign-in → reconnect_worker_by_phone
      if (flow === 'worker') {
        const phoneRaw = (f.get('phone') || '').trim();
        const phone = phoneRaw.replace(/[^0-9+]/g, '');
        const hasCode = form.dataset.hasCode === '1';
        const joinCode = hasCode ? (f.get('joinCode') || '').trim().toUpperCase() : '';

        if (!phone || phone.replace(/\D/g, '').length < 7) {
          setMsg(t('welcome_phone_invalid'), 'red'); return;
        }
        if (hasCode && (!joinCode || joinCode.length < 6)) {
          setMsg(t('welcome_invite_code_invalid'), 'red'); return;
        }

        welcomeUI.busy = true;
        try {
          setMsg(t('welcome_checking'));
          await cloudSync.enable({ url, anonKey });
          await cloudSync.ensureClient();

          const c = await cloudSync.ensureClient();
          // Always create a fresh anonymous session. Sign out first only
          // if there's already a session, to avoid deleting a usable one.
          const { data: prevSess } = await c.auth.getSession();
          if (prevSess?.session) {
            try { await c.auth.signOut({ scope: 'local' }); } catch (_) {}
          }
          setMsg(t('welcome_signing_in'));
          try {
            await cloudSync.signInAnonymously();
          } catch (e) {
            if (e && e.message === 'anonymous_provider_disabled') {
              setMsg(t('welcome_worker_anon_disabled'), 'red');
              welcomeUI.busy = false;
              return;
            }
            if (e && e.message === 'anonymous_signin_unsupported_sdk') {
              setMsg(t('welcome_worker_anon_unsupported'), 'red');
              welcomeUI.busy = false;
              return;
            }
            throw e;
          }
          // Verify we have a valid session before proceeding
          const { data: freshSess } = await c.auth.getSession();
          if (!freshSess?.session?.user?.id) {
            setMsg('Anonymous sign-in failed. Please try again.', 'red');
            welcomeUI.busy = false;
            return;
          }

          if (hasCode) {
            // ---------- FIRST-TIME: invite code path ----------
            setMsg(t('welcome_joining_biz'));
            try {
              await cloudBiz.claimStaffInvite(joinCode, null, phone);
            } catch (err) {
              const m = (err && err.message) || '';
              if (/invalid_or_used_invite|invalid_code/i.test(m)) {
                setMsg(t('welcome_invite_invalid_or_used'), 'red');
                welcomeUI.busy = false;
                return;
              }
              throw err;
            }
          } else {
            // ---------- RETURNING: phone-only reconnect ----------
            setMsg(t('welcome_worker_reconnecting'));
            try {
              await cloudBiz.reconnectWorkerByPhone(phone);
            } catch (err) {
              const m = (err && err.message) || '';
              if (/phone_not_found/i.test(m)) {
                setMsg(t('welcome_worker_phone_not_found'), 'red');
                welcomeUI.busy = false;
                return;
              }
              if (/invalid_phone/i.test(m)) {
                setMsg(t('welcome_phone_invalid'), 'red');
                welcomeUI.busy = false;
                return;
              }
              throw err;
            }
          }

          await cloudBiz.boot();
          state.cloud.phone = phone;
          state.settings.role = 'worker';
          state.settings.onboarded = true;
          save();
          toast(t('welcome_success_worker'));
          welcomeUI.busy = false;
          render();
        } catch (err) {
          welcomeUI.busy = false;
          setMsg((err && err.message) || String(err), 'red');
          console.error('[welcome:worker] submit failed:', err);
        }
        return;
      }

      // ===================== OWNER FLOW =====================
      const email = (f.get('email') || '').trim();
      const password = (f.get('password') || '').trim();
      const bizName = (f.get('bizName') || '').trim();

      if (!email || !password) { setMsg(t('welcome_missing_fields'), 'red'); return; }
      if (welcomeUI.mode === 'signup' && !bizName) { setMsg(t('welcome_missing_fields'), 'red'); return; }

      welcomeUI.busy = true;
      try {
        setMsg(t('welcome_checking'));
        await cloudSync.enable({ url, anonKey });
        await cloudSync.ensureClient();
        state.cloud.email = email;

        if (welcomeUI.mode === 'signup') {
          setMsg(t('welcome_signing_up'));
          let signupErr = null;
          try { await cloudSync.signUp(email, password); }
          catch (e) { signupErr = e; }

          const alreadyExists = signupErr && /already (registered|exists)|user_already_exists|email_already_in_use|already been registered/i.test(signupErr.message || '');
          try {
            await cloudSync.signInWithPassword(email, password);
          } catch (e) {
            if (alreadyExists) { setMsg(t('welcome_account_exists_wrong_pw'), 'red'); return; }
            setMsg(t('cloud_signup_check_email'), 'amber');
            return;
          }
        } else {
          setMsg(t('welcome_signing_in'));
          await cloudSync.signInWithPassword(email, password);
        }

        const existing = await cloudBiz.discoverMembership();

        if (!existing) {
          if (welcomeUI.mode === 'signin') {
            welcomeUI.mode = 'signup';
            welcomeUI.busy = false;
            renderWelcome($('#viewRoot'));
            setTimeout(() => {
              const m = $('#welcomeMsg');
              if (m) { m.className = 'text-xs text-amber-700 min-h-[1em]'; m.textContent = t('welcome_no_biz_owner'); }
            }, 0);
            return;
          }
          setMsg(t('welcome_creating_biz'));
          await cloudBiz.createBusiness(bizName);
          state.business.name = bizName;
        } else {
          await cloudBiz.boot();
        }
        state.settings.role = 'owner';
        state.settings.onboarded = true;
        save();
        toast(t('welcome_success_owner'));
        welcomeUI.busy = false;
        render();
      } catch (err) {
        welcomeUI.busy = false;
        const m = err && err.message;
        if (m === 'biz_invalid_code' || m === 'invalid_code') setMsg(t('biz_invalid_code'), 'red');
        else setMsg(m || String(err), 'red');
        console.error('[welcome:owner] submit failed:', err);
      }
    }

    function render() {
      const root = $('#viewRoot');
      root.classList.remove('fade-in'); void root.offsetWidth; root.classList.add('fade-in');
      $('#businessName').textContent = state.business.name || t('biz_default');

      // Role-lock guard: if the URL pins a role (worker.html → ?role=worker
      // or owner.html → ?role=owner) but the saved state is onboarded
      // for the OTHER role, we'd otherwise silently drop the user into
      // the wrong home. Force them through the correct sign-in instead
      // so each entry URL is its own front door, even when both roles
      // share localStorage on the same browser.
      if (welcomeUI.lockedRole
          && state.settings.onboarded
          && state.settings.role
          && state.settings.role !== welcomeUI.lockedRole) {
        // Tear down the wrong-role session so realtime / RPCs don't fire
        // against the previous account while the new login is in flight.
        try { cloudSync.signOut(); } catch (_) {}
        try { cloudBiz.teardown(); } catch (_) {}
        state.biz = { id: null, role: null, ownerId: null, staffId: null,
                      joinCode: null, lastEventId: 0, pendingWrites: [], status: 'idle' };
        if (state.cloud) {
          state.cloud.isAnonymous = false;
          state.cloud.userId = null;
          state.cloud.session = null;
          // Clear email when going to worker; clear phone when going to owner.
          if (welcomeUI.lockedRole === 'worker') state.cloud.email = '';
          if (welcomeUI.lockedRole === 'owner')  state.cloud.phone = '';
        }
        state.settings.onboarded = false;
        welcomeUI.step = 'auth';
        welcomeUI.role = welcomeUI.lockedRole;
        welcomeUI.mode = 'signin';
        welcomeUI.workerHasCode = false;
        save({ silent: true });
      }

      // First-run welcome / login gate — runs before anything else.
      if (!state.settings.onboarded) {
        // While the welcome form is submitting (signUp / signIn /
        // createBusiness / joinBusiness are in flight), the supabase-js
        // auth state change handler fires mid-flow and triggers a
        // re-render that would wipe the in-progress form. Skip the
        // rebuild until the flow settles — welcomeSubmit will call
        // render() itself on success or on error.
        if (welcomeUI.busy) return;
        $('#bottomNav').innerHTML = '';
        $('#fab')?.classList.add('hidden');
        $('#roleChip')?.classList.add('hidden');
        $('#settingsBtn')?.classList.add('hidden');
        renderWelcome(root);
        return;
      }

      $('#settingsBtn')?.classList.remove('hidden');
      renderBottomNav();
      renderRoleChip();

      const tab = state.currentTab;
      const role = state.settings.role;

      if (role === 'worker') {
        // Auto-select worker profile: biz.staffId → phone match → sole active
        if (!state.settings.workerId || !state.staff.find(s => s.id === state.settings.workerId)) {
          let picked = null;
          if (state.biz?.staffId) {
            picked = state.biz.staffId;
          } else {
            const active = state.staff.filter(s => s.active !== false);
            const ph = (state.cloud?.phone || '').replace(/\D/g, '');
            if (ph) {
              const match = active.find(s => (s.phone || '').replace(/\D/g, '') === ph);
              if (match) picked = match.id;
            }
            if (!picked && active.length === 1) picked = active[0].id;
          }
          if (picked) { state.settings.workerId = picked; save({ silent: true }); }
        }
        const worker = state.staff.find(s => s.id === state.settings.workerId);
        if (!worker) return renderNoWorkerSelected(root);
        if (tab === 'my_attendance') renderWorkerAttendance(root, worker);
        else if (tab === 'my_tasks') renderWorkerTasks(root, worker);
        else if (tab === 'my_payslip') renderWorkerPayslip(root, worker);
        else renderWorkerHome(root, worker);
      } else {
        if (tab === 'attendance') renderAttendance(root);
        else if (tab === 'tasks') renderTasks(root);
        else if (tab === 'staff') renderStaff(root);
        else if (tab === 'payroll') renderPayroll(root);
        else renderHome(root);
      }
      setupFab();
    }

    function renderBottomNav() {
      const role = state.settings.role;
      const tabs = role === 'worker'
        ? [
          { id: 'home', label: t('nav_home'), icon: iconHome() },
          { id: 'my_attendance', label: t('nav_my_attendance'), icon: iconCalendar() },
          { id: 'my_tasks', label: t('nav_my_tasks'), icon: iconTasks() },
          { id: 'my_payslip', label: t('nav_my_payslip'), icon: iconWallet() },
        ]
        : [
          { id: 'home', label: t('nav_home'), icon: iconHome() },
          { id: 'attendance', label: t('nav_attendance'), icon: iconCalendar() },
          { id: 'tasks', label: t('nav_tasks'), icon: iconTasks() },
          { id: 'staff', label: t('nav_staff'), icon: iconUsers() },
          { id: 'payroll', label: t('nav_payroll'), icon: iconWallet() },
        ];

      $('#bottomNav').innerHTML = `
        <div class="grid" style="grid-template-columns: repeat(${tabs.length}, minmax(0,1fr));">
          ${tabs.map(tab => `
            <button data-tab="${tab.id}" class="nav-btn flex flex-col items-center gap-1 py-3 text-slate-500 text-[11px] font-medium ${state.currentTab === tab.id ? 'tab-active' : ''}">
              ${tab.icon}
              ${escapeHtml(tab.label)}
            </button>`).join('')}
        </div>`;

      $$('.nav-btn').forEach(b => b.addEventListener('click', () => {
        state.currentTab = b.dataset.tab; save(); render();
      }));
    }

    function renderRoleChip() {
      const chip = $('#roleChip');
      if (state.settings.role === 'worker') {
        chip.textContent = t('worker');
        chip.className = 'px-2.5 py-1 rounded-full text-[11px] font-semibold bg-amber-50 text-amber-700 border border-amber-200';
        chip.classList.remove('hidden');
      } else {
        chip.classList.add('hidden');
      }
      chip.onclick = () => openSettings();
    }

    function setupFab() {
      const fab = $('#fab');
      if (state.settings.role === 'owner' && state.currentTab === 'staff') {
        fab.classList.remove('hidden');
        fab.onclick = () => openStaffForm();
      } else {
        fab.classList.add('hidden');
      }
    }

    // ============== Icons ==============
    const iconHome = () => `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5L12 3l9 6.5V21a1 1 0 0 1-1 1h-5v-7h-6v7H4a1 1 0 0 1-1-1V9.5z"/></svg>`;
    const iconCalendar = () => `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 9h18M8 3v4M16 3v4"/></svg>`;
    const iconUsers = () => `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2"/><circle cx="10" cy="7" r="4"/><path d="M21 21v-2a4 4 0 0 0-3-3.87"/><path d="M17 3.13a4 4 0 0 1 0 7.75"/></svg>`;
    const iconWallet = () => `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="3"/></svg>`;
    const iconTasks = () => `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>`;

    // ============== Owner: Home ==============
    function renderHome(root) {
      const ym = monthKey();
      const { total, staffCount } = monthTotals(ym);
      const today = todayISO();
      const todayMarks = state.attendance[today] || {};
      const presentToday = Object.values(todayMarks).filter(v => v === 'P' || v === 'H').length;
      const lang = state.settings.language || 'en';
      const dateLabel = new Date().toLocaleDateString(lang === 'en' ? 'en-IN' : lang, { weekday: 'long', day: 'numeric', month: 'long' });

      // Dashboard data
      const last7 = [];
      const last7Labels = [];
      for (let i = 6; i >= 0; i--) {
        const d = new Date(); d.setDate(d.getDate() - i);
        const iso = d.toISOString().slice(0, 10);
        const m = state.attendance[iso] || {};
        const p = Object.values(m).filter(v => v === 'P' || v === 'H').length;
        last7.push(p);
        last7Labels.push(d.toLocaleDateString(lang === 'en' ? 'en-IN' : lang, { weekday: 'short' }).slice(0, 2));
      }

      // Avg attendance last 30 days (% vs total staff)
      const activeStaffHome = state.staff.filter(s => s.active !== false);
      let attSum = 0, attDays = 0;
      for (let i = 29; i >= 0; i--) {
        const d = new Date(); d.setDate(d.getDate() - i);
        const iso = d.toISOString().slice(0, 10);
        const m = state.attendance[iso] || {};
        const marks = Object.values(m).filter(v => v);
        if (!marks.length) continue;
        const p = marks.filter(v => v === 'P' || v === 'H').length;
        attSum += p / Math.max(1, activeStaffHome.length);
        attDays++;
      }
      const avgPct = attDays ? Math.round((attSum / attDays) * 100) : 0;

      // Payroll trend (last 6 months)
      const payTrend = [];
      for (let i = 5; i >= 0; i--) {
        const d = new Date();
        d.setMonth(d.getMonth() - i);
        const key = monthKey(d);
        payTrend.push(monthTotals(key).total);
      }

      // Top absentees this month
      const topAbs = activeStaffHome.map(s => {
        const { absent } = monthAttendanceForStaff(s.id, ym);
        return { s, absent };
      }).filter(x => x.absent > 0).sort((a, b) => b.absent - a.absent).slice(0, 3);

      // Loan outstanding total
      const loanTotal = activeStaffHome.reduce((a, s) => a + loanOutstandingFor(s.id), 0);

      // Announcements preview
      const annSorted = [...state.announcements].sort((a, b) =>
        (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0) || (b.createdAt || '').localeCompare(a.createdAt || '')
      );
      const annPreview = annSorted[0];

      root.innerHTML = `
        <div class="mb-5 flex items-start justify-between gap-3">
          <div>
            <div class="text-slate-500 text-xs">${escapeHtml(dateLabel)}</div>
            <h1 class="text-2xl font-extrabold tracking-tight">${escapeHtml(t('hi_there'))}</h1>
          </div>
          <button id="annBell" class="relative w-10 h-10 rounded-full bg-white border border-slate-100 shadow-soft flex items-center justify-center" aria-label="${escapeHtml(t('announcements'))}">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10 21a2 2 0 0 0 4 0"/></svg>
            ${state.announcements.length ? `<span class="absolute top-1 right-1 w-2 h-2 rounded-full bg-rose-500"></span>` : ''}
          </button>
        </div>

        <div class="rounded-2xl bg-gradient-to-br from-brand-600 to-brand-800 text-white p-5 shadow-card mb-4">
          <div class="text-xs text-brand-100 uppercase tracking-wider font-semibold">${escapeHtml(t('this_month_payroll'))}</div>
          <div class="text-3xl font-extrabold mt-1">${fmtINR(total)}</div>
          <div class="flex items-center gap-4 mt-4 text-sm">
            <div class="flex items-center gap-1.5"><span class="w-1.5 h-1.5 rounded-full bg-emerald-300"></span>${escapeHtml(t('n_staff', { n: staffCount }))}</div>
            <div class="flex items-center gap-1.5"><span class="w-1.5 h-1.5 rounded-full bg-amber-300"></span>${escapeHtml(t('n_present_today', { n: presentToday }))}</div>
          </div>
        </div>

        ${annPreview ? `
        <button id="openAnnPreview" class="w-full text-left bg-white border border-slate-100 rounded-2xl shadow-soft p-3 mb-4 flex items-start gap-3">
          <div class="w-8 h-8 rounded-lg bg-amber-50 text-amber-600 flex items-center justify-center flex-shrink-0">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l18-8v18L3 13z"/></svg>
          </div>
          <div class="flex-1 min-w-0">
            <div class="flex items-center gap-2">
              <span class="font-semibold text-sm truncate">${escapeHtml(annPreview.title || t('announcements'))}</span>
              ${annPreview.pinned ? `<span class="chip bg-amber-50 text-amber-700">★</span>` : ''}
            </div>
            <div class="text-xs text-slate-500 truncate">${escapeHtml(annPreview.body || '')}</div>
          </div>
          <svg class="chevron-right" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
        </button>` : ''}

        <div class="bg-white border border-slate-100 rounded-2xl shadow-soft p-4 mb-4">
          <div class="flex items-center justify-between mb-2">
            <div class="font-semibold text-sm">${escapeHtml(t('overview'))}</div>
            <span class="text-xs text-slate-500">${escapeHtml(t('avg_attendance'))}: <span class="font-semibold text-slate-700">${avgPct}%</span></span>
          </div>
          <div class="grid grid-cols-3 gap-2 mb-3">
            <button id="showPresentList" class="bg-emerald-50 rounded-lg p-2 text-center active:scale-[.97] transition">
              <div class="text-lg font-extrabold text-emerald-700">${presentToday}</div>
              <div class="text-[10px] text-emerald-700/80 font-semibold uppercase">${escapeHtml(t('status_P'))}</div>
            </button>
            <button id="showAbsentList" class="bg-rose-50 rounded-lg p-2 text-center active:scale-[.97] transition">
              <div class="text-lg font-extrabold text-rose-700">${Math.max(0, staffCount - presentToday)}</div>
              <div class="text-[10px] text-rose-700/80 font-semibold uppercase">${escapeHtml(t('status_A'))}</div>
            </button>
            <div class="bg-amber-50 rounded-lg p-2 text-center">
              <div class="text-lg font-extrabold text-amber-700">${fmtINR(loanTotal).replace('₹', '₹')}</div>
              <div class="text-[10px] text-amber-700/80 font-semibold uppercase">${escapeHtml(t('loan_outstanding_total'))}</div>
            </div>
          </div>
          <div class="text-xs text-slate-500 mb-1">${escapeHtml(t('attendance_7d'))}</div>
          ${last7.every(v => v === 0) ? `<div class="text-xs text-slate-400 py-3">${escapeHtml(t('no_trend_data'))}</div>` : svgBarChart(last7, last7Labels, { color: '#2b43ec', height: 90 })}
          <div class="text-xs text-slate-500 mt-3 mb-1">${escapeHtml(t('payroll_trend'))}</div>
          ${payTrend.every(v => v === 0) ? `<div class="text-xs text-slate-400 py-3">${escapeHtml(t('no_trend_data'))}</div>` : svgLineChart(payTrend, { color: '#059669', height: 70 })}
          ${topAbs.length ? `
            <div class="text-xs text-slate-500 mt-3 mb-1">${escapeHtml(t('top_absentees'))}</div>
            <div class="space-y-1.5">
              ${topAbs.map(x => `
                <div class="flex items-center gap-2 text-sm">
                  ${avatarHTML(x.s, 'w-7 h-7')}
                  <div class="flex-1 truncate">${escapeHtml(x.s.name)}</div>
                  <span class="chip bg-rose-50 text-rose-700">${x.absent} ${escapeHtml(t('status_A'))}</span>
                </div>`).join('')}
            </div>` : ''}
        </div>

        ${renderPerformanceCard()}

        ${renderTodaysCheckinsStrip()}

        <div class="grid grid-cols-2 gap-3 mb-5">
          ${tile('attendance', 'emerald', t('mark_attendance'), t('todays_staff'), `<path d="M20 6L9 17l-5-5"/>`)}
          ${tile('staff', 'brand', t('add_staff'), t('new_employee'), `<path d="M12 5v14M5 12h14"/>`)}
          ${tile('payroll', 'amber', t('view_payroll'), t('this_month'), `<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="3"/>`)}
          <button id="exportBtn" class="bg-white border border-slate-100 rounded-2xl p-4 text-left shadow-soft active:scale-[.98] transition">
            <div class="w-9 h-9 rounded-lg bg-slate-100 flex items-center justify-center mb-2">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#334155" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            </div>
            <div class="font-semibold text-sm">${escapeHtml(t('export_data'))}</div>
            <div class="text-xs text-slate-500 mt-0.5">${escapeHtml(t('backup_excel'))}</div>
          </button>
        </div>

        <div class="bg-white border border-slate-100 rounded-2xl shadow-soft overflow-hidden">
          <div class="flex items-center justify-between px-4 pt-4 pb-2">
            <div class="font-semibold">${escapeHtml(t('your_staff'))}</div>
            <button data-go="staff" class="text-xs text-brand-600 font-semibold">${escapeHtml(t('see_all'))}</button>
          </div>
          <div>
            ${state.staff.filter(s => s.active !== false).length === 0
              ? `<div class="px-4 pb-5 pt-2 text-sm text-slate-500">${escapeHtml(t('no_staff_hint'))}</div>`
              : state.staff.filter(s => s.active !== false).slice(0, 5).map(staffRow).join('')}
          </div>
        </div>
      `;

      $$('[data-go]').forEach(b => b.addEventListener('click', () => { state.currentTab = b.dataset.go; save(); render(); }));
      $('#exportBtn')?.addEventListener('click', exportExcel);
      $('#annBell')?.addEventListener('click', openAnnouncements);
      $('#openAnnPreview')?.addEventListener('click', openAnnouncements);
      $$('[data-checkin-mark]').forEach(b => b.addEventListener('click', () => {
        markAttendance(b.dataset.checkinMark, 'P');
      }));
      $('#showPresentList')?.addEventListener('click', () => openAttendanceFilterSheet('present'));
      $('#showAbsentList')?.addEventListener('click', () => openAttendanceFilterSheet('absent'));
    }

    function openAttendanceFilterSheet(mode) {
      const today = todayISO();
      const marks = state.attendance[today] || {};
      const active = state.staff.filter(s => s.active !== false);
      const present = active.filter(s => marks[s.id] === 'P' || marks[s.id] === 'H');
      const absent = active.filter(s => !marks[s.id] || (marks[s.id] !== 'P' && marks[s.id] !== 'H'));
      const list = mode === 'present' ? present : absent;
      const title = mode === 'present' ? t('present_today') : t('absent_today');
      const color = mode === 'present' ? 'emerald' : 'rose';

      openSheet(`
        <div class="flex items-center justify-between mb-4">
          <div>
            <h2 class="text-lg font-bold">${escapeHtml(title)}</h2>
            <p class="text-xs text-slate-500">${today} · ${list.length} ${escapeHtml(t('employees'))}</p>
          </div>
          <span class="text-2xl font-extrabold text-${color}-700">${list.length}</span>
        </div>
        ${list.length === 0 ? `<div class="text-center text-sm text-slate-400 py-8">${mode === 'present' ? escapeHtml(t('no_one_present')) : escapeHtml(t('all_present'))}</div>` : `
        <div class="space-y-2">
          ${list.map(s => {
            const punch = state.punches[today]?.[s.id] || {};
            const status = marks[s.id];
            return `
            <div class="flex items-center gap-3 p-3 bg-white border border-slate-100 rounded-xl">
              ${avatarHTML(s, 'w-10 h-10')}
              <div class="flex-1 min-w-0">
                <div class="font-semibold text-sm truncate">${escapeHtml(s.name)}</div>
                <div class="text-xs text-slate-500">${escapeHtml(s.role || '—')}${punch.in ? ` · In: ${punch.in}` : ''}${punch.out ? ` · Out: ${punch.out}` : ''}</div>
              </div>
              ${status ? `<span class="chip ${ATT_COLOR[status]} border text-xs">${escapeHtml(ATT_LABEL(status))}</span>` : `<span class="chip bg-slate-100 text-slate-500 text-xs">—</span>`}
            </div>`;
          }).join('')}
        </div>`}
      `);
    }

    /** Relative-time formatter used by the "Today's check-ins" strip. */
    function relTime(iso) {
      if (!iso) return '';
      const diffMs = Date.now() - new Date(iso).getTime();
      if (!isFinite(diffMs) || diffMs < 0) return '';
      const mins = Math.floor(diffMs / 60000);
      if (mins < 1) return t('home_checkins_just_now');
      if (mins < 60) return t('home_checkins_mins', { n: mins });
      const hrs = Math.floor(mins / 60);
      return t('home_checkins_hrs', { n: hrs });
    }

    function renderPerformanceCard() {
      const ym = monthKey();
      const active = state.staff.filter(s => s.active !== false);
      const hasAnyTasks = active.some(s => monthTasksForStaff(s.id, ym).total > 0);
      if (!hasAnyTasks) return '';

      const ranked = active.map(s => {
        const t = monthTasksForStaff(s.id, ym);
        return { s, ...t };
      }).sort((a, b) => b.total - a.total).slice(0, 5);

      const teamTotal = ranked.reduce((a, r) => a + r.total, 0);

      return `
        <div class="bg-white border border-slate-100 rounded-2xl shadow-soft p-4 mb-4">
          <div class="flex items-center justify-between mb-3">
            <div class="font-semibold text-sm">${escapeHtml(t('performance'))}</div>
            <button data-go="tasks" class="text-xs text-brand-600 font-semibold">${escapeHtml(t('see_all'))}</button>
          </div>
          <div class="flex items-center gap-3 mb-3">
            <div class="bg-brand-50 rounded-lg px-3 py-2 text-center flex-1">
              <div class="text-lg font-extrabold text-brand-700">${teamTotal}</div>
              <div class="text-[10px] text-brand-700/80 font-semibold uppercase">${escapeHtml(t('shipment_total'))}</div>
            </div>
          </div>
          <div class="text-xs text-slate-500 mb-2">${escapeHtml(t('top_performers'))}</div>
          <div class="space-y-1.5">
            ${ranked.map((x, i) => `
              <div class="flex items-center gap-2 text-sm">
                <span class="w-5 h-5 rounded-full ${i === 0 ? 'bg-amber-100 text-amber-700' : 'bg-slate-100 text-slate-500'} flex items-center justify-center text-[10px] font-bold">${i + 1}</span>
                ${avatarHTML(x.s, 'w-7 h-7')}
                <div class="flex-1 truncate">${escapeHtml(x.s.name)}</div>
                <span class="text-xs font-semibold text-brand-700">${x.total}</span>
                <span class="text-[10px] text-slate-400">${escapeHtml(t('daily_average'))}: ${x.avg}</span>
              </div>`).join('')}
          </div>
        </div>`;
    }

    function renderTodaysCheckinsStrip() {
      const today = todayISO();
      const dow = new Date(today + 'T00:00:00').getDay();
      const hol = findHoliday(today);
      // Only active staff who are scheduled today (no weekly-off, no full holiday) count.
      const scheduled = state.staff.filter(s => s.active !== false && !isWeeklyOffFor(s, dow));
      if (!scheduled.length) return '';
      const punches = state.punches[today] || {};
      const rows = scheduled.map(s => {
        const p = punches[s.id];
        return { s, p, inAt: p?.inAt || null };
      });
      rows.sort((a, b) => {
        if (a.inAt && !b.inAt) return -1;
        if (b.inAt && !a.inAt) return 1;
        if (a.inAt && b.inAt) return b.inAt.localeCompare(a.inAt);
        return (a.s.name || '').localeCompare(b.s.name || '');
      });
      const inCount = rows.filter(r => r.p?.in).length;
      const total = rows.length;
      const live = cloudBiz.currentStatus() === 'live';
      const badge = cloudBiz.active()
        ? `<span class="inline-flex items-center gap-1 text-[10px] font-semibold ${live ? 'text-emerald-700' : 'text-slate-500'}">
             <span class="w-1.5 h-1.5 rounded-full ${live ? 'bg-emerald-500 animate-pulse' : 'bg-slate-300'}"></span>
             ${escapeHtml(live ? t('biz_live_badge') : t('biz_offline_badge'))}
           </span>` : '';
      return `
        <div class="bg-white border border-slate-100 rounded-2xl shadow-soft p-4 mb-4">
          <div class="flex items-center justify-between mb-2">
            <div class="flex items-center gap-2">
              <div class="font-semibold text-sm">${escapeHtml(t('home_checkins_title'))}</div>
              ${badge}
            </div>
            <div class="text-xs font-semibold text-slate-600">${escapeHtml(t('home_checkins_count', { in: inCount, total }))}</div>
          </div>
          ${hol ? `<div class="text-[11px] text-violet-700 mb-2">${escapeHtml(t('hol_label'))}: ${escapeHtml(hol.name)}</div>` : ''}
          ${rows.length === 0 ? `<div class="text-xs text-slate-400">${escapeHtml(t('home_checkins_empty'))}</div>` : `
            <div class="space-y-1.5 max-h-64 overflow-y-auto">
              ${rows.map(r => {
                const inHere = !!r.p?.in;
                const out = !!r.p?.out;
                const dotClass = inHere && out ? 'bg-slate-300' : inHere ? 'bg-emerald-500' : 'bg-slate-200';
                const inLocLink = (r.p?.inLat != null) ? ` <a href="https://www.google.com/maps?q=${r.p.inLat},${r.p.inLng}" target="_blank" rel="noopener" class="text-brand-600 hover:text-brand-800" title="${escapeHtml(t('view_on_map'))}">📍</a>` : '';
                const outLocLink = (r.p?.outLat != null) ? ` <a href="https://www.google.com/maps?q=${r.p.outLat},${r.p.outLng}" target="_blank" rel="noopener" class="text-brand-600 hover:text-brand-800" title="${escapeHtml(t('view_on_map'))}">📍</a>` : '';
                const meta = inHere
                  ? `<span class="text-emerald-700 font-semibold">${escapeHtml(r.p.in)}</span>${inLocLink}${r.inAt ? ` <span class="text-slate-400">· ${escapeHtml(relTime(r.inAt))}</span>` : ''}${out ? ` <span class="text-slate-400">· ${escapeHtml(t('out_time'))} ${escapeHtml(r.p.out)}</span>${outLocLink}` : ''}`
                  : `<span class="text-slate-400">${escapeHtml(t('home_not_checked_in'))}</span>`;
                return `
                  <div class="flex items-center gap-2.5 px-1 py-1">
                    <span class="w-2 h-2 rounded-full ${dotClass} ${inHere && !out ? 'animate-pulse' : ''}"></span>
                    ${avatarHTML(r.s, 'w-7 h-7')}
                    <div class="flex-1 min-w-0">
                      <div class="text-sm font-medium truncate">${escapeHtml(r.s.name)}</div>
                      <div class="text-[11px] truncate">${meta}</div>
                    </div>
                    ${!inHere ? `<button data-checkin-mark="${escapeHtml(r.s.id)}" class="text-[11px] font-semibold px-2 py-1 rounded-md bg-emerald-50 text-emerald-700 border border-emerald-200">${escapeHtml(t('all_present').split(' ')[1] || 'P')}</button>` : ''}
                  </div>`;
              }).join('')}
            </div>
          `}
        </div>
      `;
    }

    function tile(target, color, title, sub, svgPath) {
      const bg = { emerald: 'bg-emerald-50 stroke-emerald-600', brand: 'bg-brand-50 stroke-brand-600', amber: 'bg-amber-50 stroke-amber-600' }[color];
      const stroke = { emerald: '#059669', brand: '#2b43ec', amber: '#d97706' }[color];
      return `
        <button data-go="${target}" class="bg-white border border-slate-100 rounded-2xl p-4 text-left shadow-soft active:scale-[.98] transition">
          <div class="w-9 h-9 rounded-lg ${bg.split(' ')[0]} flex items-center justify-center mb-2">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="${stroke}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${svgPath}</svg>
          </div>
          <div class="font-semibold text-sm">${escapeHtml(title)}</div>
          <div class="text-xs text-slate-500 mt-0.5">${escapeHtml(sub)}</div>
        </button>`;
    }

    function avatarHTML(s, size = 'w-9 h-9') {
      if (s?.photo) return `<img src="${s.photo}" class="${size} rounded-full object-cover border border-slate-100" alt="">`;
      return `<div class="${size} rounded-full bg-gradient-to-br from-brand-100 to-brand-200 text-brand-800 flex items-center justify-center font-semibold text-sm">${escapeHtml(initialsOf(s?.name))}</div>`;
    }

    function staffRow(s) {
      return `
        <div class="flex items-center gap-3 px-4 py-3 border-t border-slate-100" data-staff-open="${s.id}">

          </div>
          <svg class="chevron-right" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
        </div>`;
    }

    // ============== Owner: Attendance ==============

      const date = state.currentAttendanceDate;

      const otMarks = state.overtime[date] || {};
      const pMarks = state.punches[date] || {};

      root.innerHTML = `
        <div class="mb-4">
          <h1 class="text-xl font-extrabold tracking-tight">${escapeHtml(t('attendance'))}</h1>
          <p class="text-sm text-slate-500">${escapeHtml(t('mark_each_status'))}</p>
        </div>

        <div class="flex items-center justify-between bg-white border border-slate-100 rounded-xl px-3 py-2 shadow-soft mb-4">
          <button id="prevDay" class="p-1.5 rounded-lg hover:bg-slate-100">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
          </button>
          <input type="date" id="attDate" value="${date}" class="text-sm font-semibold bg-transparent border-0 text-center focus:ring-0" />
          <button id="nextDay" class="p-1.5 rounded-lg hover:bg-slate-100">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
          </button>
        </div>

        ${state.staff.length === 0 ? `
          <div class="bg-white border border-slate-100 rounded-2xl p-6 text-center shadow-soft">
            <div class="text-slate-500 text-sm">${escapeHtml(t('add_staff_first'))}</div>
            <button data-go="staff" class="mt-3 px-4 py-2 bg-brand-600 text-white text-sm font-semibold rounded-lg">${escapeHtml(t('add_staff'))}</button>
          </div>` : `
          <div class="space-y-2">
            ${state.staff.map(s => attendanceRow(s, marks[s.id], otMarks[s.id], pMarks[s.id])).join('')}

          <div class="mt-4 grid grid-cols-4 gap-2">
            <button data-mark-all="P" class="text-xs font-semibold py-2 rounded-lg bg-emerald-50 text-emerald-700 border border-emerald-200">${escapeHtml(t('all_present'))}</button>
            <button data-mark-all="A" class="text-xs font-semibold py-2 rounded-lg bg-rose-50 text-rose-700 border border-rose-200">${escapeHtml(t('all_absent'))}</button>
            <button data-mark-all="H" class="text-xs font-semibold py-2 rounded-lg bg-amber-50 text-amber-700 border border-amber-200">${escapeHtml(t('all_half'))}</button>
            <button data-mark-all="L" class="text-xs font-semibold py-2 rounded-lg bg-sky-50 text-sky-700 border border-sky-200">${escapeHtml(t('all_leave'))}</button>

      $('#prevDay').addEventListener('click', () => shiftDay(-1));
      $('#nextDay').addEventListener('click', () => shiftDay(1));
      $$('[data-mark-all]').forEach(b => b.addEventListener('click', () => bulkMark(b.dataset.markAll)));
      $$('[data-mark]').forEach(b => b.addEventListener('click', () => markAttendance(b.dataset.staff, b.dataset.status)));
      $$('[data-ot]').forEach(b => b.addEventListener('click', () => openOtSheet(b.dataset.ot)));
      $$('[data-punch]').forEach(b => b.addEventListener('click', () => openPunchSheet(b.dataset.punch)));
      $$('[data-go]').forEach(b => b.addEventListener('click', () => { state.currentTab = b.dataset.go; save(); render(); }));
    }

    // ============== Owner: Tasks ==============
    function monthTasksForStaff(staffId, ym) {
      const dim = daysInMonth(ym);
      let total = 0; const catTotals = {};
      let manDays = 0;
      (state.taskCategories || []).forEach(c => { catTotals[c] = 0; });
      for (let d = 1; d <= dim; d++) {
        const key = `${ym}-${String(d).padStart(2, '0')}`;
        const entry = state.taskLog[key]?.[staffId];
        if (entry && entry.total > 0) {
          total += entry.total;
          manDays++;
          Object.entries(entry.categories || {}).forEach(([k, v]) => { catTotals[k] = (catTotals[k] || 0) + v; });
        }
      }
      return { total, catTotals, manDays, avg: manDays ? Math.round(total / manDays) : 0 };
    }

      const date = state.currentAttendanceDate;
      const dayLog = state.taskLog[date] || {};

      const active = state.staff.filter(s => s.active !== false);

      function taskRow(s) {
        const entry = dayLog[s.id] || { total: 0, categories: {} };
        return `
          <div class="bg-white border border-slate-100 rounded-xl p-3 shadow-soft">
            <div class="flex items-center gap-2 mb-2">
              ${avatarHTML(s, 'w-8 h-8')}

                <div class="font-semibold text-sm truncate">${escapeHtml(s.name)}</div>

              </div>
              <div class="text-right">
                <input data-task-total="${s.id}" type="number" min="0" value="${entry.total || ''}" placeholder="0"
                  class="w-16 text-right text-sm font-bold border border-slate-200 rounded-lg px-2 py-1.5 focus:ring-2 focus:ring-brand-200 focus:outline-none">
              </div>
            </div>
            ${cats.length ? `
            <div class="grid gap-1.5" style="grid-template-columns: repeat(${Math.min(cats.length, 3)}, 1fr);">
              ${cats.map(c => `
                <div>
                  <div class="text-[10px] text-slate-400 truncate mb-0.5">${escapeHtml(c)}</div>
                  <input data-task-cat="${s.id}|${c}" type="number" min="0" value="${entry.categories?.[c] || ''}" placeholder="0"
                    class="w-full text-xs border border-slate-100 rounded px-1.5 py-1 text-center focus:ring-1 focus:ring-brand-200 focus:outline-none">
                </div>`).join('')}
            </div>` : ''}
          </div>`;
      }

      root.innerHTML = `
        <div class="mb-4">
          <h1 class="text-xl font-extrabold tracking-tight">${escapeHtml(t('tasks'))}</h1>
          <p class="text-sm text-slate-500">${escapeHtml(t('task_log'))}</p>
        </div>

        <div class="flex items-center justify-between bg-white border border-slate-100 rounded-xl px-3 py-2 shadow-soft mb-4">
          <button id="prevTaskDay" class="p-1.5 rounded-lg hover:bg-slate-100">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
          </button>
          <input type="date" id="taskDate" value="${date}" class="text-sm font-semibold bg-transparent border-0 text-center focus:ring-0" />
          <button id="nextTaskDay" class="p-1.5 rounded-lg hover:bg-slate-100">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
          </button>
        </div>

        ${active.length === 0 ? `
          <div class="bg-white border border-slate-100 rounded-2xl p-6 text-center shadow-soft">
            <div class="text-slate-500 text-sm">${escapeHtml(t('add_staff_first'))}</div>
          </div>` : `
          <div class="space-y-2">${active.map(taskRow).join('')}</div>
          <button id="saveTasksBtn" class="mt-4 w-full py-3 rounded-xl bg-brand-600 text-white font-semibold text-sm active:scale-[.99] transition">${escapeHtml(t('task_save'))}</button>
        `}
      `;

      const shiftTaskDay = (dir) => {
        const d = new Date(state.currentAttendanceDate + 'T00:00:00');
        d.setDate(d.getDate() + dir);
        state.currentAttendanceDate = d.toISOString().slice(0, 10);
        save(); render();
      };
      $('#taskDate')?.addEventListener('change', e => { state.currentAttendanceDate = e.target.value; save(); render(); });
      $('#prevTaskDay')?.addEventListener('click', () => shiftTaskDay(-1));
      $('#nextTaskDay')?.addEventListener('click', () => shiftTaskDay(1));

      $('#saveTasksBtn')?.addEventListener('click', () => {
        state.taskLog[date] = state.taskLog[date] || {};
        active.forEach(s => {
          const totalEl = $(`[data-task-total="${s.id}"]`);
          const total = Math.max(0, parseInt(totalEl?.value) || 0);
          const categories = {};
          cats.forEach(c => {
            const el = $(`[data-task-cat="${s.id}|${c}"]`);
            categories[c] = Math.max(0, parseInt(el?.value) || 0);
          });
          state.taskLog[date][s.id] = { total, categories };
          if (cloudBiz.emit) {
            cloudBiz.emit('task_log', s.id, { date, total, categories });
          }
        });
        save(); toast(t('task_saved')); render();
      });
    }

    function punchSummary(p) {
      if (!p || (!p.in && !p.out)) return `<span class="text-slate-400">${escapeHtml(t('not_punched'))}</span>`;
      const span = workedSpan(p.in, p.out);
      const parts = [];
      if (p.in) {
        let loc = '';
        if (p.inLat != null) loc = ` <a href="https://www.google.com/maps?q=${p.inLat},${p.inLng}" target="_blank" rel="noopener" title="${escapeHtml(t('view_on_map'))}">📍</a>`;
        parts.push(`<span class="text-emerald-700 font-semibold">${escapeHtml(t('in_time'))} ${p.in}</span>${loc}`);
      }
      if (p.out) {
        let loc = '';
        if (p.outLat != null) loc = ` <a href="https://www.google.com/maps?q=${p.outLat},${p.outLng}" target="_blank" rel="noopener" title="${escapeHtml(t('view_on_map'))}">📍</a>`;
        parts.push(`<span class="text-rose-700 font-semibold">${escapeHtml(t('out_time'))} ${p.out}</span>${loc}`);
      }
      if (span) parts.push(`<span class="text-slate-500">· ${escapeHtml(t('worked_hrs', { h: span.h, m: pad2(span.m) }))}</span>`);
      return parts.join(' ');
    }

    function attendanceRow(s, status, otHrs, punch) {
      const opts = ['P', 'A', 'H', 'L'];
      const date = state.currentAttendanceDate;
      const dow = new Date(date + 'T00:00:00').getDay();

        ? `<span class="chip ${ATT_COLOR[status]} border">${escapeHtml(ATT_LABEL(status))}</span>`
        : isOff
          ? `<span class="chip bg-slate-100 text-slate-600 border border-slate-200">${escapeHtml(t('wo_label'))}</span>`
          : hol
            ? `<span class="chip bg-violet-50 text-violet-700 border border-violet-200">${escapeHtml(t('hol_label'))}</span>`
            : '';
      return `
        <div class="bg-white border border-slate-100 rounded-2xl p-3 shadow-soft">
          <div class="flex items-center gap-3 mb-3">
            ${punch?.selfie

              <div class="font-medium text-sm truncate">${escapeHtml(s.name)}</div>
              <div class="text-xs text-slate-500">${escapeHtml(s.role || '—')}${hol ? ' · ' + escapeHtml(hol.name) : ''}</div>
            </div>

              </button>`).join('')}
          </div>
          <div class="mt-2 text-xs text-slate-600">${punchSummary(punch)}</div>
          <div class="mt-1 flex items-center justify-between text-xs">
            <div class="text-slate-500">${escapeHtml(t('ot'))}: <span class="font-semibold text-slate-700">${otHrs ? otHrs + ' h' : '—'}</span></div>
            <div class="flex gap-3">
              <button data-ot="${s.id}" class="text-brand-600 font-semibold">${escapeHtml(t('add_ot'))}</button>
              <button data-punch="${s.id}" class="text-brand-600 font-semibold">${escapeHtml(t('punch'))}</button>
            </div>
          </div>
        </div>`;
    }

    function markAttendance(staffId, status) {
      const date = state.currentAttendanceDate;
      state.attendance[date] = state.attendance[date] || {};
      const toggled = state.attendance[date][staffId] === status;
      if (toggled) delete state.attendance[date][staffId];
      else state.attendance[date][staffId] = status;
      const finalStatus = toggled ? '' : status;
      let autoPunchedIn = null;
      // Auto-punch-in on "Present" for today if not already punched in
      if (status === 'P' && !toggled && date === todayISO()) {
        state.punches[date] = state.punches[date] || {};
        const p = state.punches[date][staffId] || {};
        if (!p.in) {
          p.in = nowHM();
          p.inAt = new Date().toISOString();
          state.punches[date][staffId] = p;
          autoPunchedIn = { date, time: p.in, at: p.inAt };
        }
      }
      save(); render();
      if (cloudBiz.active()) {
        cloudBiz.emit('attendance', staffId, { date, status: finalStatus }).catch(() => {});
        if (autoPunchedIn) cloudBiz.emit('punch_in', staffId, autoPunchedIn).catch(() => {});
      }
    }
    function bulkMark(status) {
      const date = state.currentAttendanceDate;
      state.attendance[date] = state.attendance[date] || {};
      state.staff.forEach(s => { state.attendance[date][s.id] = status; });
      save(); toast(t('marked_all', { x: ATT_LABEL(status).toLowerCase() })); render();
    }
    function shiftDay(delta) {
      const d = new Date(state.currentAttendanceDate);
      d.setDate(d.getDate() + delta);
      state.currentAttendanceDate = d.toISOString().slice(0, 10);
      save(); render();
    }

        <div class="mb-3">
          <div class="text-lg font-bold">${escapeHtml(t('punch'))}</div>
          <div class="text-xs text-slate-500">${escapeHtml(s.name)} · ${escapeHtml(date)}</div>
        </div>
        <form id="punchForm" class="space-y-3">

            </button>
          </div>` : ''}
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="text-xs font-semibold text-slate-600">${escapeHtml(t('punch_in_time'))}</label>
              <div class="flex gap-1 mt-1">
                <input name="in" type="time" value="${p.in || ''}" class="flex-1 px-2 py-2 border border-slate-200 rounded-lg text-sm">
                <button type="button" data-set="in" class="px-2 py-2 text-xs font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200 rounded-lg">${escapeHtml(t('now_time'))}</button>
              </div>
            </div>
            <div>
              <label class="text-xs font-semibold text-slate-600">${escapeHtml(t('punch_out_time'))}</label>
              <div class="flex gap-1 mt-1">
                <input name="out" type="time" value="${p.out || ''}" class="flex-1 px-2 py-2 border border-slate-200 rounded-lg text-sm">
                <button type="button" data-set="out" class="px-2 py-2 text-xs font-semibold bg-rose-50 text-rose-700 border border-rose-200 rounded-lg">${escapeHtml(t('now_time'))}</button>
              </div>
            </div>
          </div>
          ${(p.inLat != null || p.outLat != null) ? `<div class="text-xs text-slate-500 space-y-1">
            ${p.inLat != null ? `<div>📍 ${escapeHtml(t('punch_in_loc'))}: <a href="https://www.google.com/maps?q=${p.inLat},${p.inLng}" target="_blank" rel="noopener" class="text-brand-600 underline">${escapeHtml(t('view_on_map'))}</a> <span class="text-slate-400">(±${p.inLocAcc || '?'}m)</span></div>` : ''}
            ${p.outLat != null ? `<div>📍 ${escapeHtml(t('punch_out_loc'))}: <a href="https://www.google.com/maps?q=${p.outLat},${p.outLng}" target="_blank" rel="noopener" class="text-brand-600 underline">${escapeHtml(t('view_on_map'))}</a> <span class="text-slate-400">(±${p.outLocAcc || '?'}m)</span></div>` : ''}
          </div>` : ''}
          <div class="flex gap-2 pt-1">
            <button type="button" id="punchClear" class="flex-1 py-3 rounded-lg border border-rose-200 text-rose-600 font-semibold text-sm">${escapeHtml(t('clear_punches'))}</button>
            <button type="button" id="punchCancel" class="flex-1 py-3 rounded-lg border border-slate-200 font-semibold text-sm">${escapeHtml(t('cancel'))}</button>
            <button type="submit" class="flex-1 py-3 rounded-lg bg-brand-600 text-white font-semibold text-sm">${escapeHtml(t('save'))}</button>
          </div>
        </form>
      `);

      let pendingSelfie = p.selfie || null;

      if ($('#selfieBtn')) {
        $('#selfieBtn').addEventListener('click', async () => {
          const data = await pickAndCompressImage();
          if (!data) return;
          pendingSelfie = data;
          $('#selfiePreview').innerHTML = `<img src="${data}" class="w-full h-full object-cover" alt="">`;
          $('#selfieBtn').textContent = t('retake_selfie');
        });
      }

      $$('[data-set]').forEach(b => b.addEventListener('click', () => {
        const field = b.dataset.set;
        $('#punchForm').elements[field].value = nowHM();
      }));

      $('#punchCancel').addEventListener('click', closeSheet);

      $('#punchClear').addEventListener('click', () => {
        if (state.punches[date]) delete state.punches[date][staffId];
        save(); closeSheet(); render();
      });

      $('#punchForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const f = new FormData(e.target);
        const inT = f.get('in') || '';
        const outT = f.get('out') || '';
        state.punches[date] = state.punches[date] || {};
        const existing = state.punches[date][staffId] || {};
        const next = { ...existing };
        const inChanged  = inT && inT !== existing.in;
        const outChanged = outT && outT !== existing.out;
        const selfieChanged = pendingSelfie && pendingSelfie !== existing.selfie;
        const loc = (inChanged || outChanged) && state.settings.punchGps !== false ? await getPunchLocation() : null;
        if (inT) {
          next.in = inT; next.inAt = next.inAt || new Date().toISOString();
          if (loc && inChanged) { next.inLat = loc.lat; next.inLng = loc.lng; next.inLocAcc = loc.locAcc; }
        } else { delete next.in; delete next.inAt; delete next.inLat; delete next.inLng; delete next.inLocAcc; }
        if (outT) {
          next.out = outT; next.outAt = next.outAt || new Date().toISOString();
          if (loc && outChanged) { next.outLat = loc.lat; next.outLng = loc.lng; next.outLocAcc = loc.locAcc; }
        } else { delete next.out; delete next.outAt; delete next.outLat; delete next.outLng; delete next.outLocAcc; }
        if (pendingSelfie) next.selfie = pendingSelfie; else delete next.selfie;
        if (!next.in && !next.out && !next.selfie) delete state.punches[date][staffId];
        else state.punches[date][staffId] = next;
        save(); closeSheet(); toast(t('saved')); render();
        if (cloudBiz.active()) {
          const locFields = loc ? { lat: loc.lat, lng: loc.lng, locAcc: loc.locAcc } : {};
          if (inChanged)  cloudBiz.emit('punch_in',  staffId, { date, time: next.in,  at: next.inAt,  selfie: selfieChanged ? pendingSelfie : undefined, ...locFields }).catch(() => {});
          if (outChanged) cloudBiz.emit('punch_out', staffId, { date, time: next.out, at: next.outAt, ...locFields }).catch(() => {});
          if (selfieChanged && !inChanged) cloudBiz.emit('selfie', staffId, { date, dataUrl: pendingSelfie }).catch(() => {});
        }
      });
    }

              ? `<button type="button" id="delStaff" class="flex-1 py-3 rounded-lg border border-emerald-200 text-emerald-700 text-sm font-semibold">${escapeHtml(t('reactivate'))}</button>`
              : `<button type="button" id="delStaff" class="flex-1 py-3 rounded-lg border border-rose-200 text-rose-600 text-sm font-semibold">${escapeHtml(t('remove_employee'))}</button>`
            ) : ''}
            <button type="submit" class="flex-1 py-3 rounded-lg bg-brand-600 text-white text-sm font-semibold">${escapeHtml(editing ? t('save_changes') : t('add_staff_btn'))}</button>
          </div>
        </form>
      `);

      let pendingPhoto = editing?.photo || null;
      let photoRemoved = false;

      $('#staffPhotoBtn').addEventListener('click', async () => {
        const img = await pickAndCompressImage();
        if (!img) return;
        pendingPhoto = img; photoRemoved = false;
        $('#staffPhotoPreview').innerHTML = `<img src="${img}" class="w-full h-full object-cover" alt="">`;
      });
      $('#staffPhotoRm')?.addEventListener('click', () => {
        pendingPhoto = null; photoRemoved = true;
        $('#staffPhotoPreview').innerHTML = escapeHtml(t('photo'));
      });

      $$('input[name="salaryType"]').forEach(r => r.addEventListener('change', e => {
        $('#pieceRateRow')?.classList.toggle('hidden', e.target.value !== 'piece');
      }));

      if (editing) renderStaffLoanList(editing.id);
      $('#addLoanBtn')?.addEventListener('click', () => openLoanForm(editing.id));

      $('#staffForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const f = new FormData(e.target);
        const otRateVal = f.get('otRate');
        const weeklyOffs = [];
        for (let i = 0; i < 7; i++) if (f.get('wo_' + i)) weeklyOffs.push(i);
        const data = {
          name: (f.get('name') || '').trim(),
          role: (f.get('role') || '').trim(),
          phone: (f.get('phone') || '').trim(),
          empCode: (f.get('empCode') || '').trim(),
          joinDate: f.get('joinDate') || '',
          dob: f.get('dob') || '',
          exitDate: f.get('exitDate') || '',
          address: (f.get('address') || '').trim(),
          salaryType: f.get('salaryType') || 'monthly',
          amount: Number(f.get('amount') || 0),
          pieceRate: Number(f.get('pieceRate') || 0) || null,
          otRate: otRateVal ? Number(otRateVal) : null,
          shiftId: f.get('shiftId') || '',
          weeklyOffs,
          active: f.get('active') === 'on',
          emergency: {
            name: (f.get('emgName') || '').trim(),
            phone: (f.get('emgPhone') || '').trim(),
            relation: (f.get('emgRelation') || '').trim(),
          },
          aadhaar: (f.get('aadhaar') || '').trim(),
          pan: (f.get('pan') || '').trim(),
          bank: {
            holder: (f.get('bankHolder') || '').trim(),
            account: (f.get('bankAcc') || '').trim(),
            ifsc: (f.get('bankIfsc') || '').trim(),
          },
          upiId: (f.get('upiId') || '').trim(),
        };
        if (photoRemoved) data.photo = null;
        else if (pendingPhoto) data.photo = pendingPhoto;
        if (!data.name) return;
        if (editing) {
          Object.assign(editing, data);
          audit('staff_updated', { id: editing.id, name: data.name });
          toast(t('staff_updated'));
          save(); closeSheet(); render();
        } else {
          const newStaff = { id: uid(), joinedAt: todayISO(), ...data };
          state.staff.push(newStaff);
          audit('staff_added', { id: newStaff.id, name: data.name });
          toast(t('staff_added'));
          save();
          // Owner is signed in to a business → mint a personal invite
          // code for this staff and pop the share sheet immediately.
          // If they're offline / not yet in a business we silently skip;
          // they can do it later from the staff card.
          if (cloudBiz.isOwner && cloudBiz.isOwner()) {
            closeSheet();
            render();
            openStaffInviteSheet(newStaff.id, { mint: true });
          } else {
            closeSheet();
            render();
          }
        }
      });
      $('#delStaff')?.addEventListener('click', () => {
        const s = state.staff.find(x => x.id === staffId);
        if (!s) return;
        if (s.active === false) {
          // Re-activate ex-employee
          if (!confirm(t('reactivate_confirm'))) return;
          s.active = true;
          delete s.exitDate;
          audit('staff_reactivated', { id: staffId, name: s.name });
          save(); closeSheet(); toast(t('staff_reactivated')); render();
        } else {
          // Soft-delete: move to ex-employees
          if (!confirm(t('confirm_delete'))) return;
          s.active = false;
          s.exitDate = s.exitDate || todayISO();
          if (state.settings.workerId === staffId) state.settings.workerId = null;
          audit('staff_removed', { id: staffId, name: s.name });
          save(); closeSheet(); toast(t('staff_removed')); render();
        }
      });
    }

    /** Owner-facing: show a per-staff invite code with Copy / Share /
     *  Rotate / Revoke. Pass { mint:true } to force-mint a fresh code
     *  (used right after creating a new staff). Otherwise it tries to
     *  read the existing unclaimed code from staff_invites and only
     *  mints a new one if none exists. */
    async function openStaffInviteSheet(staffId, opts) {
      const s = state.staff.find(x => x.id === staffId);
      if (!s) return;
      const mint = !!(opts && opts.mint);
      // Render placeholder while we fetch.
      openSheet(`
        <div class="mb-3">
          <div class="text-lg font-bold">${escapeHtml(t('staff_invite_title'))}</div>
          <div class="text-xs text-slate-500">${escapeHtml(s.name)}</div>
        </div>
        <div id="inviteBody" class="rounded-xl bg-slate-50 border border-slate-200 p-4 text-center text-sm text-slate-500">
          ${escapeHtml(t('staff_invite_loading'))}
        </div>
        <button id="inviteClose" class="w-full mt-3 py-3 rounded-lg bg-slate-100 font-semibold text-sm">${escapeHtml(t('close'))}</button>
      `);
      $('#inviteClose').addEventListener('click', () => closeSheet());

      const renderBody = (code, used) => {
        const workerUrl = buildWorkerUrl();
        const bizName = state.business.name || 'PayBox';
        const shareText = `${bizName} — ${t('staff_invite_share_for')} ${s.name}\n\n` +
          `1) ${t('staff_invite_share_step1')}: ${workerUrl}\n` +
          `2) ${t('staff_invite_share_step2')}\n` +
          `3) ${t('staff_invite_share_step3')}: ${code}`;
        $('#inviteBody').innerHTML = `
          ${used ? `<div class="text-xs text-emerald-700 font-semibold mb-2">${escapeHtml(t('staff_invite_used_badge'))}</div>` : ''}
          <div class="text-[10px] uppercase tracking-wider font-bold text-slate-500 mb-1">${escapeHtml(t('staff_invite_code_label'))}</div>
          <code class="block text-2xl font-mono font-extrabold tracking-[0.3em] text-emerald-700 bg-white border border-emerald-200 rounded-lg py-3">${escapeHtml(code)}</code>
          <div class="text-[11px] text-slate-500 mt-3 text-left leading-relaxed">${escapeHtml(t('staff_invite_help'))}</div>
          <div class="grid grid-cols-2 gap-2 mt-3">
            <button id="invCopy" class="py-2.5 rounded-lg border border-emerald-300 bg-white text-emerald-700 text-sm font-semibold">${escapeHtml(t('cloud_worker_url_copy'))}</button>
            <button id="invShare" class="py-2.5 rounded-lg bg-emerald-600 text-white text-sm font-semibold">${escapeHtml(t('cloud_worker_url_share'))}</button>
          </div>
          ${used ? '' : `
          <div class="grid grid-cols-2 gap-2 mt-2">
            <button id="invRotate" class="py-2 rounded-lg border border-slate-300 text-slate-700 text-xs font-semibold">${escapeHtml(t('staff_invite_rotate'))}</button>
            <button id="invRevoke" class="py-2 rounded-lg border border-rose-200 text-rose-600 text-xs font-semibold">${escapeHtml(t('staff_invite_revoke'))}</button>
          </div>`}
        `;
        $('#invCopy').addEventListener('click', async () => {
          try { await navigator.clipboard.writeText(`${workerUrl}\nCode: ${code}`); toast(t('cloud_worker_url_copied')); }
          catch { toast(t('cloud_worker_url_copied')); }
        });
        $('#invShare').addEventListener('click', async () => {
          if (navigator.share) {
            try { await navigator.share({ title: `${bizName} — ${s.name}`, text: shareText, url: workerUrl }); return; } catch {}
          }
          try { await navigator.clipboard.writeText(shareText); toast(t('cloud_worker_url_copied')); }
          catch { /* noop */ }
        });
        $('#invRotate')?.addEventListener('click', async () => {
          try {
            const fresh = await cloudBiz.createStaffInvite(s.id, s.name);
            renderBody(fresh, false);
            toast(t('staff_invite_rotated'));
          } catch (e) { toast(e.message || String(e)); }
        });
        $('#invRevoke')?.addEventListener('click', async () => {
          if (!confirm(t('staff_invite_revoke_confirm'))) return;
          try {
            await cloudBiz.revokeStaffInvite(s.id);
            $('#inviteBody').innerHTML = `<div class="text-sm text-slate-500">${escapeHtml(t('staff_invite_revoked'))}</div>`;
            toast(t('staff_invite_revoked'));
          } catch (e) { toast(e.message || String(e)); }
        });
      };

      try {
        let code = null, used = false;
        if (!mint) {
          const list = await cloudBiz.listStaffInvites();
          const existing = list.find(r => r.staff_id === s.id && !r.used_at);
          const claimed  = list.find(r => r.staff_id === s.id && r.used_at);
          if (existing) { code = existing.code; used = false; }
          else if (claimed && !existing) { code = claimed.code; used = true; }
        }
        if (!code && !used) {
          code = await cloudBiz.createStaffInvite(s.id, s.name);
        }
        renderBody(code, used);
      } catch (err) {
        $('#inviteBody').innerHTML = `<div class="text-sm text-rose-600">${escapeHtml(err.message || String(err))}</div>`;
      }
    }

    function renderStaffLoanList(staffId) {
      const list = $('#loanList');
      if (!list) return;
      const loans = state.loans.filter(l => l.staffId === staffId);
      if (!loans.length) {
        list.innerHTML = `<div class="text-xs text-slate-400">${escapeHtml(t('no_loans'))}</div>`;
        return;
      }
      const nowYm = monthKey();
      list.innerHTML = loans.map(l => {
        const paid = Math.min(l.principal || 0, countLoanPaid(l, nowYm) * (l.emi || 0));
        const outstanding = Math.max(0, (l.principal || 0) - paid);
        const badge = l.closed
          ? `<span class="chip bg-slate-100 text-slate-500">${escapeHtml(t('loan_closed'))}</span>`
          : outstanding === 0
            ? `<span class="chip bg-emerald-50 text-emerald-700">${escapeHtml(t('loan_paid'))}</span>`
            : `<span class="chip bg-amber-50 text-amber-700">${fmtINR(outstanding)} ${escapeHtml(t('loan_outstanding'))}</span>`;
        return `
          <div class="bg-white border border-slate-100 rounded-lg p-2 text-sm flex items-center justify-between">
            <div>
              <div class="font-semibold">${fmtINR(l.principal)} · ${fmtINR(l.emi)}/mo</div>
              <div class="text-xs text-slate-500">${escapeHtml(l.note || '')} · ${escapeHtml(l.startYm || '')}</div>
              <div class="mt-1">${badge}</div>
            </div>
            <div class="flex flex-col gap-1">
              <button type="button" data-loan-toggle="${l.id}" class="text-xs font-semibold text-slate-600 px-2 py-1 rounded border border-slate-200">${escapeHtml(l.closed ? t('reopen_loan') : t('close_loan'))}</button>
              <button type="button" data-loan-del="${l.id}" class="text-xs font-semibold text-rose-600 px-2 py-1 rounded border border-rose-200">${escapeHtml(t('remove'))}</button>
            </div>
          </div>`;
      }).join('');
      $$('[data-loan-toggle]').forEach(b => b.addEventListener('click', () => {
        const l = state.loans.find(x => x.id === b.dataset.loanToggle);
        if (!l) return;
        l.closed = !l.closed;
        audit('loan_toggled', { id: l.id, closed: l.closed });
        save(); renderStaffLoanList(staffId);
      }));
      $$('[data-loan-del]').forEach(b => b.addEventListener('click', () => {
        state.loans = state.loans.filter(x => x.id !== b.dataset.loanDel);
        audit('loan_removed', { id: b.dataset.loanDel });
        save(); toast(t('loan_removed')); renderStaffLoanList(staffId);
      }));
    }

    function openLoanForm(staffId) {
      openSheet(`
        <div class="mb-3">
          <div class="text-lg font-bold">${escapeHtml(t('new_loan'))}</div>
        </div>
        <form id="loanForm" class="space-y-3">
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="text-xs font-semibold text-slate-600">${escapeHtml(t('principal'))} *</label>
              <input name="principal" type="number" min="1" step="1" required class="w-full mt-1 px-3 py-2.5 border border-slate-200 rounded-lg text-sm" autofocus>
            </div>
            <div>
              <label class="text-xs font-semibold text-slate-600">${escapeHtml(t('emi'))} *</label>
              <input name="emi" type="number" min="1" step="1" required class="w-full mt-1 px-3 py-2.5 border border-slate-200 rounded-lg text-sm">
            </div>
          </div>
          <div>
            <label class="text-xs font-semibold text-slate-600">${escapeHtml(t('start_month'))}</label>
            <input name="startYm" type="month" value="${monthKey()}" class="w-full mt-1 px-3 py-2.5 border border-slate-200 rounded-lg text-sm">
          </div>
          <div>
            <label class="text-xs font-semibold text-slate-600">${escapeHtml(t('adj_note'))}</label>
            <input name="note" class="w-full mt-1 px-3 py-2.5 border border-slate-200 rounded-lg text-sm">
          </div>
          <div class="flex gap-2 pt-2">
            <button type="button" id="loanCancel" class="flex-1 py-3 rounded-lg border border-slate-200 font-semibold text-sm">${escapeHtml(t('cancel'))}</button>
            <button type="submit" class="flex-1 py-3 rounded-lg bg-brand-600 text-white font-semibold text-sm">${escapeHtml(t('save'))}</button>
          </div>
        </form>
      `);
      $('#loanCancel').addEventListener('click', () => openStaffForm(staffId));
      $('#loanForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const f = new FormData(e.target);
        const loan = {
          id: uid(), staffId,
          principal: Number(f.get('principal') || 0),
          emi: Number(f.get('emi') || 0),
          startYm: f.get('startYm') || monthKey(),
          note: (f.get('note') || '').trim(),
          createdAt: new Date().toISOString(),
          closed: false,
        };
        if (!loan.principal || !loan.emi) return;
        state.loans.push(loan);
        audit('loan_added', { id: loan.id, staffId, principal: loan.principal, emi: loan.emi });
        save(); toast(t('loan_added')); openStaffForm(staffId);
      });
    }

    // ============== Owner: Payroll ==============
    function renderPayroll(root) {
      const ym = state.currentPayrollMonth;
      const { total } = monthTotals(ym);
      const lang = state.settings.language || 'en';
      const monthLabel = new Date(ym + '-01').toLocaleDateString(lang === 'en' ? 'en-IN' : lang, { month: 'long', year: 'numeric' });

      root.innerHTML = `
        <div class="mb-4 flex items-end justify-between">
          <div>
            <h1 class="text-xl font-extrabold tracking-tight">${escapeHtml(t('payroll'))}</h1>
            <p class="text-sm text-slate-500">${escapeHtml(t('auto_calc'))}</p>
          </div>
          <input type="month" id="monthPick" value="${ym}" class="text-sm font-semibold bg-white border border-slate-200 rounded-lg px-2 py-1.5">
        </div>

        <div class="rounded-2xl bg-gradient-to-br from-slate-900 to-slate-700 text-white p-5 shadow-card mb-4">
          <div class="text-xs text-slate-300 uppercase tracking-wider font-semibold">${escapeHtml(monthLabel)}</div>
          <div class="text-3xl font-extrabold mt-1">${fmtINR(total)}</div>
          <div class="text-xs text-slate-300 mt-2">${escapeHtml(t('days_basis', { n: state.settings.workingDaysPerMonth }))}</div>
        </div>

        ${state.staff.length === 0
          ? `<div class="bg-white border border-slate-100 rounded-2xl p-6 text-center shadow-soft text-sm text-slate-500">${escapeHtml(t('no_staff_for_payroll'))}</div>`
          : `<div class="space-y-2">${state.staff.map(s => payrollCard(s, ym)).join('')}</div>`
        }
      `;

      $('#monthPick').addEventListener('change', (e) => { state.currentPayrollMonth = e.target.value; save(); render(); });
      $$('[data-payslip]').forEach(b => b.addEventListener('click', () => openPayslip(b.dataset.payslip, ym)));
    }

    function payrollCard(s, ym) {
      const { present, half, absent, leave } = monthAttendanceForStaff(s.id, ym);
      const { net, effectiveDays } = salaryForMonth(s, ym);
      return `
        <button data-payslip="${s.id}" class="w-full text-left bg-white border border-slate-100 rounded-2xl p-3 shadow-soft active:scale-[.99] transition">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-gradient-to-br from-brand-100 to-brand-200 text-brand-800 flex items-center justify-center font-semibold">${escapeHtml(initialsOf(s.name))}</div>
            <div class="flex-1 min-w-0">
              <div class="font-semibold text-sm truncate">${escapeHtml(s.name)}</div>
              <div class="text-xs text-slate-500 mt-0.5">
                <span class="chip bg-emerald-50 text-emerald-700">P ${present}</span>
                <span class="chip bg-amber-50 text-amber-700">H ${half}</span>
                <span class="chip bg-sky-50 text-sky-700">L ${leave}</span>
                <span class="chip bg-rose-50 text-rose-700">A ${absent}</span>
              </div>
            </div>
            <div class="text-right">
              <div class="text-base font-extrabold">${fmtINR(net)}</div>
              <div class="text-[11px] text-slate-400">${effectiveDays.toFixed(1)} ${escapeHtml(t('day'))}</div>
            </div>
          </div>
        </button>`;
    }

      const s = state.staff.find(x => x.id === staffId);
      if (!s) return;

      const calc = salaryForMonth(s, ym);

      const businessName = state.business.name || t('biz_default');

      openSheet(`
        <div class="text-center mb-4">
          <div class="w-14 h-14 rounded-full bg-gradient-to-br from-brand-100 to-brand-200 text-brand-800 flex items-center justify-center font-bold mx-auto">${escapeHtml(initialsOf(s.name))}</div>

          <div class="text-xs text-slate-500">${escapeHtml(s.role || '—')} · ${escapeHtml(monthLabel)}</div>

          <div class="bg-amber-50 rounded-lg py-2"><div class="text-lg font-bold text-amber-700">${att.half}</div><div class="text-[10px] text-amber-700 font-semibold">${escapeHtml(t('status_H'))}</div></div>
          <div class="bg-sky-50 rounded-lg py-2"><div class="text-lg font-bold text-sky-700">${att.leave}</div><div class="text-[10px] text-sky-700 font-semibold">${escapeHtml(t('status_L'))}</div></div>
          <div class="bg-rose-50 rounded-lg py-2"><div class="text-lg font-bold text-rose-700">${att.absent}</div><div class="text-[10px] text-rose-700 font-semibold">${escapeHtml(t('status_A'))}</div></div>

        <div class="bg-white border border-slate-100 rounded-xl p-3 text-sm space-y-2 mb-3">

          ${calc.otPay > 0 ? `<div class="flex justify-between"><span class="text-slate-500">${escapeHtml(t('ot_amount'))} (${calc.otHours} h)</span><span class="font-semibold">+ ${fmtINR(calc.otPay)}</span></div>` : ''}
          ${calc.bonus > 0 ? `<div class="flex justify-between"><span class="text-slate-500">${escapeHtml(t('bonus_total'))}</span><span class="font-semibold text-emerald-700">+ ${fmtINR(calc.bonus)}</span></div>` : ''}
          ${calc.incentives > 0 ? `<div class="flex justify-between"><span class="text-slate-500">${escapeHtml(t('incentives_total'))}</span><span class="font-semibold text-emerald-700">+ ${fmtINR(calc.incentives)}</span></div>` : ''}
          ${calc.advances > 0 ? `<div class="flex justify-between"><span class="text-slate-500">${escapeHtml(t('advances_total'))}</span><span class="font-semibold text-rose-700">− ${fmtINR(calc.advances)}</span></div>` : ''}
          ${calc.deductions > 0 ? `<div class="flex justify-between"><span class="text-slate-500">${escapeHtml(t('deductions_total'))}</span><span class="font-semibold text-rose-700">− ${fmtINR(calc.deductions)}</span></div>` : ''}
          ${calc.loanEmi > 0 ? `<div class="flex justify-between"><span class="text-slate-500">${escapeHtml(t('emi_deduction'))}</span><span class="font-semibold text-rose-700">− ${fmtINR(calc.loanEmi)}</span></div>` : ''}
          <div class="border-t border-slate-100 pt-2 flex justify-between">
            <span class="font-semibold">${escapeHtml(t('net_payable'))}</span>
            <span class="font-extrabold">${fmtINR(calc.net)}</span>
          </div>
          <div class="flex justify-between text-xs text-slate-400"><span>${escapeHtml(t('rate'))}</span><span>${salaryLabel(s)}</span></div>
          <div class="flex justify-between text-xs text-slate-400"><span>${escapeHtml(t('effective_days'))}</span><span>${calc.effectiveDays.toFixed(2)}${(calc.weeklyOffs || calc.paidHolidays) ? ` <span class="text-slate-300">(${calc.weeklyOffs ? calc.weeklyOffs + ' ' + t('wo_label') : ''}${calc.weeklyOffs && calc.paidHolidays ? ', ' : ''}${calc.paidHolidays ? calc.paidHolidays + ' ' + t('hol_label') : ''})</span>` : ''}</span></div>
        </div>

        ${state.settings.role === 'owner' ? `
        <div class="mb-3">

          ${adjs.length === 0

          }
