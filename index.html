<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- viewport-fit=cover is required so iOS notch / Android gesture bar
       don't clip the app. Safe-area-inset CSS below handles the padding. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#2b43ec" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="PayBox" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="format-detection" content="telephone=no" />
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src  'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com https://cdn.jsdelivr.net;
    style-src   'self' 'unsafe-inline' https://fonts.googleapis.com;
    font-src    'self' https://fonts.gstatic.com;
    img-src     'self' data: blob:;
    connect-src 'self' https://*.supabase.co wss://*.supabase.co https://cdn.jsdelivr.net https://cdn.tailwindcss.com;
    frame-src   'none';
    object-src  'none';
    base-uri    'self';
  " />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon-180.png" />
  <title>PayBox — Staff & Payroll, Simplified</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Noto+Sans+Tamil:wght@400;500;600;700&family=Noto+Sans+Telugu:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'Noto Sans Devanagari', 'Noto Sans Tamil', 'Noto Sans Telugu', 'system-ui', 'sans-serif'] },
          colors: {
            brand: {
              50: '#eef4ff', 100: '#dbe6ff', 200: '#bfd1ff', 300: '#93b1ff',
              400: '#6486ff', 500: '#3f60f7', 600: '#2b43ec', 700: '#2434d0',
              800: '#212ea8', 900: '#202c85',
            }
          },
          boxShadow: {
            'soft': '0 1px 2px rgba(16,24,40,.04), 0 1px 3px rgba(16,24,40,.06)',
            'card': '0 4px 12px rgba(16,24,40,.06), 0 2px 4px rgba(16,24,40,.04)',
          }
        }
      }
    }
  </script>
  <style>
    html, body { font-family: 'Inter','Noto Sans Devanagari','Noto Sans Tamil','Noto Sans Telugu', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: #f7f8fb; }
    /* Safe-area insets so the notch / Dynamic Island / gesture bar don't
       overlap real UI. Used inside Capacitor and browsers that honour
       viewport-fit=cover (Safari 11+, modern Chrome). */
    @supports (padding: env(safe-area-inset-top)) {
      body { padding-left: env(safe-area-inset-left); padding-right: env(safe-area-inset-right); }
      header.safe-top { padding-top: env(safe-area-inset-top); }
      nav.safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
      #sheet.safe-bottom { padding-bottom: max(env(safe-area-inset-bottom), 12px); }
      #installPrompt.safe-bottom { margin-bottom: calc(env(safe-area-inset-bottom) + 8px); }
    }
    /* In native apps the WebView handles status bar; remove the Tailwind
       100vh quirks by letting main scroll. */
    html.native, html.native body { overscroll-behavior-y: none; -webkit-user-select: none; user-select: none; }
    html.native input, html.native textarea, html.native [contenteditable] { -webkit-user-select: text; user-select: text; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .fade-in { animation: fade 200ms ease-out; }
    @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    .tab-active { color: #2b43ec; }
    .tab-active svg { stroke: #2b43ec; }
    .chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
    .sheet { animation: sheetUp 220ms cubic-bezier(.2,.8,.2,1); }
    @keyframes sheetUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .backdrop-fade { animation: bg 180ms ease-out; }
    @keyframes bg { from { opacity: 0; } to { opacity: 1; } }
    input, select, textarea, button { font-family: inherit; }
    input:focus, select:focus, textarea:focus { outline: none; box-shadow: 0 0 0 3px rgba(63,96,247,.15); border-color: #3f60f7 !important; }
    [dir="rtl"] svg.chevron-right { transform: scaleX(-1); }
  </style>
</head>

        </div>
        <div class="flex items-center gap-1">
          <button id="roleChip" class="hidden px-2.5 py-1 rounded-full text-[11px] font-semibold"></button>

    <button id="fab" class="hidden fixed bottom-20 right-[calc(50%-14rem+16px)] w-14 h-14 rounded-full bg-brand-600 text-white shadow-card flex items-center justify-center active:scale-95 transition z-40">

    </button>

    <div id="sheet" class="safe-bottom hidden fixed inset-x-0 bottom-0 mx-auto max-w-md bg-white rounded-t-2xl z-50 sheet max-h-[92vh] overflow-y-auto">
      <div class="flex justify-center pt-2"><div class="w-10 h-1.5 bg-slate-200 rounded-full"></div></div>
      <div id="sheetBody" class="p-4"></div>
    </div>

    <div id="toast" class="hidden fixed bottom-24 left-1/2 -translate-x-1/2 bg-slate-900 text-white text-sm px-4 py-2 rounded-full shadow-card z-[60]"></div>

    <div id="installPrompt" class="hidden fixed bottom-24 left-4 right-4 mx-auto max-w-md bg-slate-900 text-white rounded-xl p-3 z-[55] flex items-center gap-3 shadow-card">

      try {
        const img = new Image();
        await new Promise((r, rj) => { img.onload = r; img.onerror = rj; img.src = dataUrl; });
        const MAX = 320;
        const scale = Math.min(1, MAX / Math.max(img.width, img.height));
        const w = Math.max(1, Math.round(img.width * scale));
        const h = Math.max(1, Math.round(img.height * scale));
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        return canvas.toDataURL('image/jpeg', 0.78);
      } catch (_) { return dataUrl; }

      // system file picker. Use @capacitor/filesystem to write into
      // Documents/ and then share the resulting path.
      if (Native.on) {

    // ============== QR code ==============
    function qrDataURL(text, size = 4) {
      if (typeof qrcode === 'undefined') return null;
      try {
        const q = qrcode(0, 'M');
        q.addData(text);
        q.make();
        const n = q.getModuleCount();
        const s = size;
        const canvas = document.createElement('canvas');
        canvas.width = n * s;
        canvas.height = n * s;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#000';
        for (let y = 0; y < n; y++) {
          for (let x = 0; x < n; x++) {
            if (q.isDark(y, x)) ctx.fillRect(x * s, y * s, s, s);
          }
        }
        return canvas.toDataURL('image/png');
      } catch { return null; }
    }

    // ============== SVG charts ==============
    function svgBarChart(values, labels, opts = {}) {
      const w = opts.width || 320, h = opts.height || 90, pad = 18;
      const max = Math.max(1, ...values);
      const bw = (w - pad * 2) / Math.max(values.length, 1);
      const bars = values.map((v, i) => {
        const bh = ((v / max) * (h - pad - 14));
        const x = pad + i * bw + 2;
        const y = h - 14 - bh;
        return `<rect x="${x}" y="${y}" width="${bw - 4}" height="${bh}" rx="3" fill="${opts.color || '#2b43ec'}" opacity="${v === 0 ? 0.2 : 0.9}"/>
          <text x="${x + (bw - 4) / 2}" y="${h - 2}" font-size="9" text-anchor="middle" fill="#94a3b8">${escapeHtml(labels[i] || '')}</text>`;
      }).join('');
      return `<svg viewBox="0 0 ${w} ${h}" class="w-full" preserveAspectRatio="none">${bars}</svg>`;
    }

    function svgLineChart(values, opts = {}) {
      const w = opts.width || 320, h = opts.height || 80, pad = 6;
      if (!values.length) return '';
      const max = Math.max(1, ...values);
      const step = (w - pad * 2) / Math.max(values.length - 1, 1);
      const pts = values.map((v, i) => `${pad + i * step},${h - pad - ((v / max) * (h - pad * 2))}`).join(' ');
      const last = values[values.length - 1];
      const lastY = h - pad - ((last / max) * (h - pad * 2));
      const areaPts = `${pad},${h - pad} ${pts} ${w - pad},${h - pad}`;
      return `<svg viewBox="0 0 ${w} ${h}" class="w-full">
        <polygon points="${areaPts}" fill="${opts.color || '#2b43ec'}" opacity="0.12"/>
        <polyline points="${pts}" fill="none" stroke="${opts.color || '#2b43ec'}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="${pad + (values.length - 1) * step}" cy="${lastY}" r="3.5" fill="${opts.color || '#2b43ec'}"/>
      </svg>`;
    }

    function loanEmiFor(staffId, ym) {
      let total = 0;
      const loans = state.loans.filter(l => l.staffId === staffId && !l.closed);
      loans.forEach(l => {
        if (!l.startYm || l.startYm > ym) return;
        const paidSoFar = countLoanPaid(l, ym);
        const limit = Math.ceil((l.principal || 0) / Math.max(1, l.emi || 1));
        if (paidSoFar >= limit) return;
        total += Number(l.emi || 0);
      });
      return total;
    }
    function countLoanPaid(loan, uptoYm) {
      if (!loan.startYm) return 0;
      const [sy, sm] = loan.startYm.split('-').map(Number);
      const [ey, em] = uptoYm.split('-').map(Number);
      return Math.max(0, (ey - sy) * 12 + (em - sm));
    }
    function loanOutstandingFor(staffId) {
      let total = 0;
      const nowYm = monthKey();
      state.loans.filter(l => l.staffId === staffId && !l.closed).forEach(l => {
        const paid = Math.min(l.principal || 0, countLoanPaid(l, nowYm) * (l.emi || 0));
        total += Math.max(0, (l.principal || 0) - paid);
      });
      return total;
    }

    // ============== Cloud sync (Supabase) ==============
    // Design:
    //   - Single row per authenticated user in table `mybox_state`:
    //       user_id uuid PK (= auth.uid()), data jsonb, updated_at bigint
    //   - RLS restricts each row to its owner.
    //   - Local state is source of truth offline; we push on save (debounced)
    //     and pull on sign-in. Conflicts use last-write-wins via updated_at.
    const SUPABASE_CDN = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js';
    const cloudSync = (() => {
      let client = null;        // Supabase client once configured
      let sdkPromise = null;    // cached SDK loader
      let pushTimer = null;     // debounce handle
      let status = 'idle';      // idle | syncing | synced | error | offline | signedout | live
      let listeners = new Set();
      let channel = null;       // Realtime channel subscription
      let realtimeUserId = null; // who the current channel is scoped to
      // Self-echo guard: when we push, we stamp updated_at. Any realtime event
      // whose updated_at is <= this value was (likely) our own write.
      let lastPushedAt = 0;

      function setStatus(next, extra) {
        status = next;
        listeners.forEach(fn => { try { fn(status, extra); } catch {} });
      }
      function onStatus(fn) { listeners.add(fn); return () => listeners.delete(fn); }
      function currentStatus() { return status; }

      async function loadSdk() {
        if (window.supabase) return window.supabase;
        if (sdkPromise) return sdkPromise;
        sdkPromise = new Promise((resolve, reject) => {
          const s = document.createElement('script');
          s.src = SUPABASE_CDN; s.async = true;
          s.onload = () => resolve(window.supabase);
          s.onerror = () => reject(new Error('Supabase SDK failed to load'));
          document.head.appendChild(s);
        });
        return sdkPromise;
      }

      function config() { return state.cloud || {}; }
      function isConfigured() { const c = config(); return !!(c.url && c.anonKey); }

      async function ensureClient() {
        if (client) return client;
        if (!isConfigured()) throw new Error('cloud_not_configured');
        const sdk = await loadSdk();
        client = sdk.createClient(config().url, config().anonKey, {
          auth: { persistSession: true, storageKey: _urlRole ? `paybox_auth_${_urlRole}` : 'paybox_auth' },
        });
        // Refresh session from SDK on every auth change; keep the email for UI.
        // We intentionally do NOT store the full session (JWT tokens) in
        // paybox_v2 — supabase-js manages tokens in its own paybox_auth key.
        // Only non-sensitive metadata is kept in our state.
        client.auth.onAuthStateChange((_ev, session) => {
          state.cloud.session = session ? true : null;
          state.cloud.userId = session?.user?.id || null;
          state.cloud.email = session?.user?.email || state.cloud.email || '';
          save({ silent: true });
          // Re-scope realtime when the user changes (including sign-out → null).
          if ((session?.user?.id || null) !== realtimeUserId) {
            teardownRealtime();
            if (session?.user?.id) ensureRealtime().catch(() => {});
          }
          render();
        });
        return client;
      }

      /** Subscribe to postgres changes on the user's row so edits on one
       *  device flow to others without manual pulls. Safe to call multiple
       *  times: only one subscription is kept per user. */
      async function ensureRealtime() {
        if (!state.cloud.enabled || !isConfigured()) return;
        if (v2Mode()) return;     // cloudBiz owns realtime in v2
        const c = await ensureClient();
        const session = await c.auth.getSession();
        const uid = session?.data?.session?.user?.id;
        if (!uid) return;
        if (channel && realtimeUserId === uid) return;  // already live
        teardownRealtime();
        realtimeUserId = uid;
        try {
          channel = c
            .channel('paybox_state:' + uid)
            .on(
              'postgres_changes',
              { event: '*', schema: 'public', table: 'mybox_state', filter: 'user_id=eq.' + uid },
              (payload) => applyRealtimePayload(payload)
            )
            .subscribe((s) => {
              if (s === 'SUBSCRIBED') setStatus('live');
              else if (s === 'CHANNEL_ERROR' || s === 'TIMED_OUT' || s === 'CLOSED') setStatus('synced');
            });
        } catch (_) { /* realtime is best-effort */ }
      }

      function teardownRealtime() {
        if (channel && client) { try { client.removeChannel(channel); } catch (_) {} }
        channel = null; realtimeUserId = null;
      }

      /** Apply a realtime payload if it is truly newer than our local state
       *  and was not our own push. */
      function applyRealtimePayload(payload) {
        const row = payload?.new || payload?.record || null;
        if (!row || !row.data) return;
        const remoteAt = Number(row.updated_at || 0);
        if (!remoteAt) return;
        // Echo guard: our last push used exactly this timestamp.
        if (remoteAt <= lastPushedAt) return;
        if (remoteAt <= Number(state.updatedAt || 0)) return;
        const preserved = state.cloud;
        state = migrate(deepMerge(structuredClone(defaultState), row.data));
        state.cloud = preserved;
        state.updatedAt = remoteAt;
        save({ silent: true });
        setStatus('live');
        render();
      }

      async function sendMagicLink(email) {
        const c = await ensureClient();
        state.cloud.email = email;
        save({ silent: true });
        const { error } = await c.auth.signInWithOtp({
          email,
          options: { emailRedirectTo: location.href.split('#')[0] },
        });
        if (error) throw error;
      }

      async function signInWithPassword(email, password) {
        const c = await ensureClient();
        const { data, error } = await c.auth.signInWithPassword({ email, password });
        if (error) throw error;
        state.cloud.email = data.user?.email || email;
        state.cloud.userId = data.user?.id || null;
        state.cloud.session = data.session ? true : null;
        save({ silent: true });
        await pull();
        ensureRealtime().catch(() => {});
        return data;
      }

      async function signUp(email, password) {
        const c = await ensureClient();
        const { data, error } = await c.auth.signUp({
          email, password,
          options: { emailRedirectTo: location.href.split('#')[0] },
        });
        if (error) throw error;
        return data;
      }

      // Phone-only worker login uses Supabase anonymous sign-in. No SMS
      // is sent and no password is set — the worker proves identity via
      // the per-staff invite code that the owner gave them. supabase-js
      // persists the resulting JWT in localStorage so the next visit on
      // the same device is auto-signed-in (no code re-entry).
      async function signInAnonymously() {
        const c = await ensureClient();
        if (typeof c.auth.signInAnonymously !== 'function') {
          throw new Error('anonymous_signin_unsupported_sdk');
        }
        const { data, error } = await c.auth.signInAnonymously();
        if (error) {
          // Surface the most common misconfiguration with a friendlier code.
          if (/anonymous|disabled|provider/i.test(error.message || '')) {
            const e = new Error('anonymous_provider_disabled');
            e.cause = error;
            throw e;
          }
          throw error;
        }
        state.cloud.userId = data.user?.id || null;
        state.cloud.session = data.session ? true : null;
        state.cloud.email = '';
        state.cloud.isAnonymous = true;
        save({ silent: true });
        ensureRealtime().catch(() => {});
        return data;
      }

      async function signOut() {
        try { if (client) await client.auth.signOut(); } catch {}
        teardownRealtime();
        state.cloud.session = null;
        state.cloud.userId = null;
        setStatus('signedout');
        save({ silent: true });
      }

      async function ensureSignedIn() {
        const c = await ensureClient();
        const { data } = await c.auth.getSession();
        return data?.session || null;
      }

      /** Push local state to cloud (last-write-wins based on updatedAt). */
      async function push() {
        if (!state.cloud.enabled || !isConfigured()) return;
        if (v2Mode()) return;     // cloudBiz handles push in v2
        if (!navigator.onLine) { setStatus('offline'); return; }
        const c = await ensureClient();
        const session = await ensureSignedIn();
        if (!session) { setStatus('signedout'); return; }
        setStatus('syncing');
        try {
          const { cloud: _c, ...clean } = state;   // never persist local-only cloud config
          const row = {
            user_id: session.user.id,
            data: clean,
            updated_at: state.updatedAt || Date.now(),
          };
          const { error } = await c.from('mybox_state').upsert(row, { onConflict: 'user_id' });
          if (error) throw error;
          state.cloud.lastPushAt = Date.now();
          lastPushedAt = row.updated_at;
          save({ silent: true });
          setStatus(channel ? 'live' : 'synced');
        } catch (e) {
          setStatus('error', e.message || String(e));
          throw e;
        }
      }

      /** Pull from cloud and merge if remote is newer. */
      async function pull() {
        if (!isConfigured()) return;
        if (v2Mode()) return;     // legacy single-blob path is disabled
        if (!navigator.onLine) { setStatus('offline'); return; }
        const c = await ensureClient();
        const session = await ensureSignedIn();
        if (!session) { setStatus('signedout'); return; }
        setStatus('syncing');
        try {
          const { data, error } = await c
            .from('mybox_state')
            .select('data, updated_at')
            .eq('user_id', session.user.id)
            .maybeSingle();
          if (error) throw error;
          if (data && data.data && Number(data.updated_at || 0) > Number(state.updatedAt || 0)) {
            // Remote is newer: replace local data but preserve cloud config.
            const preserved = state.cloud;
            state = migrate(deepMerge(structuredClone(defaultState), data.data));
            state.cloud = preserved;
            state.updatedAt = Number(data.updated_at) || state.updatedAt;
          }
          state.cloud.lastPullAt = Date.now();
          save({ silent: true });
          setStatus('synced');
          render();
        } catch (e) {
          setStatus('error', e.message || String(e));
          throw e;
        }
      }

      function scheduleSync() {
        if (v2Mode()) return;     // cloudBiz handles its own debounced push
        clearTimeout(pushTimer);
        pushTimer = setTimeout(() => { push().catch(() => {}); }, 1500);
      }

      async function syncNow() {
        if (v2Mode()) {
          try { await cloudBiz.pullConfig?.(); await cloudBiz.flushQueue?.(); } catch (_) {}
          return;
        }
        // Explicit button: pull first (to pick up remote edits), then push local.
        await pull();
        await push();
      }

      async function enable({ url, anonKey }) {
        state.cloud.url = (url || '').trim();
        state.cloud.anonKey = (anonKey || '').trim();
        state.cloud.enabled = true;
        client = null;   // force rebuild with new creds
        save({ silent: true });
      }

      function disable() {
        state.cloud.enabled = false;
        clearTimeout(pushTimer);
        teardownRealtime();
        client = null;
        save({ silent: true });
        setStatus('idle');
      }

      /** True when this app is running in v2 (business-scoped) mode and
       *  should NOT touch the legacy `mybox_state` table at all. We use
       *  this both when a baked-in DEFAULT_CLOUD is present (publisher
       *  ships v2 only) and once the user has joined / created a business. */
      function v2Mode() {
        return !!(state.biz?.id || hasDefaultCloud());
      }

      /** Called from app init. If cloud is configured and a session exists,
       *  hydrate from remote before the first render and wire up realtime. */
      async function boot() {
        if (!state.cloud?.enabled || !isConfigured()) return;
        // v2: cloudBiz.boot() handles everything; nothing to do here.
        if (v2Mode()) {
          try { await ensureClient(); } catch (_) {}
          return;
        }
        try {
          const c = await ensureClient();
          const { data } = await c.auth.getSession();
          const session = data?.session;
          if (!session) { setStatus('signedout'); return; }
          state.cloud.userId = session.user?.id || state.cloud.userId;
          state.cloud.email = session.user?.email || state.cloud.email;
          await pull();
          ensureRealtime().catch(() => {});
        } catch (e) {
          // Boot must never block the UI — fall back to local data.
          setStatus('error', e.message || String(e));
        }
      }

      window.addEventListener('online',  () => { if (state.cloud?.enabled) scheduleSync(); });
      window.addEventListener('offline', () => setStatus('offline'));

      return {
        loadSdk, ensureClient, isConfigured,
        sendMagicLink, signInWithPassword, signUp, signInAnonymously, signOut,
        push, pull, syncNow, scheduleSync,
        enable, disable, onStatus, currentStatus,
        ensureRealtime, teardownRealtime, applyRealtimePayload, boot,
      };
    })();
    // Expose for tests (no-op for real users).
    window.__cloudSync = cloudSync;

    // ============== Business-scoped real-time sync (v2) ==============
    // Design (see CLOUD_SYNC.md):
    //   - businesses (jsonb config) — owner is sole writer.
    //   - members — links auth.users to a business with role+staff mapping.
    //   - events — append-only row per action: punch_in/out, attendance, ot,
    //     selfie, announce, adjust, loan_pay.
    //   Owners debounce-push the full config blob AND append events for
    //   high-churn actions. Workers only append events (RLS enforces this).
    //   Both sides subscribe to postgres_changes on the two tables filtered
    //   by business_id, so every member sees changes within ~1-2s.
    const cloudBiz = (() => {
      const CONFIG_KEYS = ['business','staff','shifts','holidays','announcements','loans','adjustments','settings','attendance','overtime','punches'];
      let channel = null;         // realtime subscription
      let cfgTimer = null;        // debounce handle for config push
      let flushTimer = null;      // offline queue flusher
      let listeners = new Set();
      let scopedBizId = null;

      function setStatus(next, extra) {
        state.biz.status = next;
        listeners.forEach(fn => { try { fn(next, extra); } catch {} });
      }
      const onStatus = (fn) => { listeners.add(fn); return () => listeners.delete(fn); };
      const currentStatus = () => state.biz.status || 'idle';
      const active = () => !!state.biz?.id && !!state.biz?.role && state.biz.role !== 'pending';
      const isOwner  = () => state.biz?.role === 'owner';

      async function client() {
        // Reuse the same Supabase client cloudSync builds, so we share auth.
        return await cloudSync.ensureClient();
      }

      function extractConfig() {
        const out = {};
        for (const k of CONFIG_KEYS) out[k] = structuredClone(state[k]);
        return out;
      }

      /** Merge a remote config blob into local state without clobbering
       *  cloud/biz or bumping updatedAt (silent save). */
      function applyConfig(config) {
        if (!config || typeof config !== 'object') return;
        for (const k of CONFIG_KEYS) {
          if (config[k] !== undefined) state[k] = deepMerge(structuredClone(defaultState[k] ?? (Array.isArray(config[k]) ? [] : {})), config[k]);
        }
        save({ silent: true });
      }

      /** Fold one event row into local state. Idempotent: applying the same
       *  row twice produces the same state, so we don't need to dedupe
       *  strictly — but we do bump lastEventId so subscriptions don't
       *  thrash re-renders. */
      function applyEvent(ev) {
        if (!ev || !ev.kind) return;
        const d = ev.payload || {};
        const sid = ev.staff_id;
        switch (ev.kind) {
          case 'punch_in': {
            if (!d.date) break;
            state.punches[d.date] = state.punches[d.date] || {};
            const p = state.punches[d.date][sid] || {};
            p.in = d.time || p.in;
            p.inAt = d.at || p.inAt || new Date().toISOString();
            if (d.selfie) p.selfie = d.selfie;
            if (d.lat != null) { p.inLat = d.lat; p.inLng = d.lng; p.inLocAcc = d.locAcc; }
            state.punches[d.date][sid] = p;
            if (d.date === todayISO()) {
              state.attendance[d.date] = state.attendance[d.date] || {};
              if (!state.attendance[d.date][sid]) state.attendance[d.date][sid] = 'P';
            }
            break;
          }
          case 'punch_out': {
            if (!d.date) break;
            state.punches[d.date] = state.punches[d.date] || {};
            const p = state.punches[d.date][sid] || {};
            p.out = d.time || p.out;
            p.outAt = d.at || p.outAt || new Date().toISOString();
            if (d.lat != null) { p.outLat = d.lat; p.outLng = d.lng; p.outLocAcc = d.locAcc; }
            state.punches[d.date][sid] = p;
            break;
          }
          case 'selfie': {
            if (!d.date) break;
            state.punches[d.date] = state.punches[d.date] || {};
            const p = state.punches[d.date][sid] || {};
            if (d.dataUrl) p.selfie = d.dataUrl;
            state.punches[d.date][sid] = p;
            break;
          }
          case 'attendance': {
            if (!d.date) break;
            state.attendance[d.date] = state.attendance[d.date] || {};
            if (d.status) state.attendance[d.date][sid] = d.status;
            else delete state.attendance[d.date][sid];
            break;
          }
          case 'ot': {
            if (!d.date) break;
            state.overtime[d.date] = state.overtime[d.date] || {};
            if (Number(d.hours) > 0) state.overtime[d.date][sid] = Number(d.hours);
            else delete state.overtime[d.date][sid];
            break;
          }
          case 'staff_update': {
            const idx = state.staff.findIndex(s => s.id === sid);
            if (idx === -1) break;
            const allowed = ['name', 'phone', 'photo'];
            const next = { ...state.staff[idx] };
            for (const k of allowed) {
              if (k in d) next[k] = d[k];
            }
            state.staff[idx] = next;
            break;
          }
          case 'task_log': {
            if (!d.date) break;
            state.taskLog[d.date] = state.taskLog[d.date] || {};
            state.taskLog[d.date][sid] = {
              total: Number(d.total) || 0,
              categories: d.categories || {},
            };
            break;
          }
          default: break;
        }
        if (ev.id && Number(ev.id) > Number(state.biz.lastEventId || 0)) {
          state.biz.lastEventId = Number(ev.id);
        }
      }

      /** Emit an event. Writes to server + applies locally optimistically.
       *  Falls back to the offline queue if we're offline or not yet
       *  authenticated. Safe to call from non-members (no-op). */
      async function emit(kind, staffId, payload) {
        if (!active()) return;
        // Optimistic local apply so UI updates instantly.
        applyEvent({ id: 0, kind, staff_id: staffId, payload: payload || {} });
        save({ silent: true });

        const env = { kind, staff_id: staffId, payload: payload || {}, t: Date.now() };
        if (!navigator.onLine) { queueWrite(env); setStatus('offline'); return; }
        try {
          const c = await client();
          const { data: sess } = await c.auth.getSession();
          if (!sess?.session) { queueWrite(env); setStatus('signedout'); return; }
          const row = {
            business_id: state.biz.id,
            author_id: sess.session.user.id,
            staff_id: staffId,
            kind, payload: env.payload,
            updated_at: Date.now(),
          };
          const { data, error } = await c.from('events').insert(row).select().single();
          if (error) throw error;
          if (data?.id && Number(data.id) > Number(state.biz.lastEventId || 0)) {
            state.biz.lastEventId = Number(data.id);
            save({ silent: true });
          }
        } catch (e) {
          queueWrite(env);
          setStatus('error', e.message || String(e));
        }
      }

      function queueWrite(env) {
        state.biz.pendingWrites.push(env);
        if (state.biz.pendingWrites.length > 500) state.biz.pendingWrites.shift();
        save({ silent: true });
      }

      async function flushQueue() {
        if (!active() || !navigator.onLine) return;
        if (!state.biz.pendingWrites?.length) return;
        try {
          const c = await client();
          const { data: sess } = await c.auth.getSession();
          if (!sess?.session) return;
          const rows = state.biz.pendingWrites.map(env => ({
            business_id: state.biz.id,
            author_id: sess.session.user.id,
            staff_id: env.staff_id,
            kind: env.kind,
            payload: env.payload,
            updated_at: env.t || Date.now(),
          }));
          const { data, error } = await c.from('events').insert(rows).select();
          if (error) throw error;
          state.biz.pendingWrites = [];
          const maxId = Math.max(...(data || []).map(r => Number(r.id) || 0), Number(state.biz.lastEventId || 0));
          state.biz.lastEventId = maxId;
          save({ silent: true });
        } catch (_) { /* retry on next flush */ }
      }

      /** Owner-only: debounce push the whole config blob. Safe to call often. */
      function scheduleConfigPush() {
        if (!isOwner()) return;
        clearTimeout(cfgTimer);
        cfgTimer = setTimeout(() => pushConfig().catch(() => {}), 1500);
      }

      async function pushConfig() {
        if (!isOwner()) return;
        if (!navigator.onLine) { setStatus('offline'); return; }
        try {
          const c = await client();
          const { error } = await c.from('businesses')
            .update({ config: extractConfig(), updated_at: Date.now() })
            .eq('id', state.biz.id);
          if (error) throw error;
          setStatus(channel ? 'live' : 'synced');
        } catch (e) { setStatus('error', e.message || String(e)); }
      }

      async function pullConfig() {
        try {
          const c = await client();
          const { data, error } = await c.from('businesses')
            .select('config, join_code, owner_id, updated_at')
            .eq('id', state.biz.id).maybeSingle();
          if (error) throw error;
          if (!data) return;
          state.biz.joinCode = data.join_code || state.biz.joinCode;
          state.biz.ownerId  = data.owner_id  || state.biz.ownerId;
          if (!isOwner()) applyConfig(data.config);  // owner is source of truth, don't overwrite their local
          setStatus(channel ? 'live' : 'synced');
        } catch (e) { setStatus('error', e.message || String(e)); }
      }

      async function pullEventsSince(id) {
        try {
          const c = await client();
          const { data, error } = await c.from('events')
            .select('*')
            .eq('business_id', state.biz.id)
            .gt('id', Number(id || 0))
            .order('id', { ascending: true })
            .limit(1000);
          if (error) throw error;
          (data || []).forEach(applyEvent);
          if (data?.length) save({ silent: true });
        } catch (_) { /* offline-safe */ }
      }

      async function subscribe() {
        if (!active()) return;
        const c = await client();
        if (channel && scopedBizId === state.biz.id) return;
        teardown();
        scopedBizId = state.biz.id;
        try {
          channel = c.channel('paybox_biz:' + state.biz.id)
            .on('postgres_changes',
              { event: '*', schema: 'public', table: 'businesses', filter: 'id=eq.' + state.biz.id },
              (payload) => {
                const row = payload?.new;
                if (!row) return;
                state.biz.joinCode = row.join_code || state.biz.joinCode;
                state.biz.ownerId  = row.owner_id  || state.biz.ownerId;
                if (!isOwner() && row.config) { applyConfig(row.config); render(); }
              })
            .on('postgres_changes',
              { event: 'INSERT', schema: 'public', table: 'events', filter: 'business_id=eq.' + state.biz.id },
              (payload) => {
                const row = payload?.new;
                if (!row || !row.id) return;
                if (Number(row.id) <= Number(state.biz.lastEventId || 0)) return;
                applyEvent(row);
                save({ silent: true });
                render();
                // Toast for owners when a worker punches in/out.
                if (isOwner() && (row.kind === 'punch_in' || row.kind === 'punch_out')) {
                  const staff = (state.staff || []).find(s => s.id === row.staff_id);
                  const name = staff?.name || row.staff_id;
                  const time = (row.payload || {}).time || '';
                  const verb = row.kind === 'punch_in' ? 'punched in' : 'punched out';
                  toast(time ? `${name} ${verb} at ${time}` : `${name} ${verb}`);
                }
              })
            .on('postgres_changes',
              { event: '*', schema: 'public', table: 'members', filter: 'business_id=eq.' + state.biz.id },
              () => { refreshMembership().catch(() => {}); render(); })
            .subscribe((s) => {
              if (s === 'SUBSCRIBED') setStatus('live');
              else if (s === 'CHANNEL_ERROR' || s === 'TIMED_OUT' || s === 'CLOSED') setStatus('synced');
            });
        } catch (_) { /* best-effort */ }
      }

      function teardown() {
        if (channel) { try { cloudSync.ensureClient().then(c => c.removeChannel(channel)); } catch (_) {} }
        channel = null; scopedBizId = null;
      }

      async function refreshMembership() {
        try {
          const c = await client();
          const { data: sess } = await c.auth.getSession();
          if (!sess?.session) return;
          const { data } = await c.from('members')
            .select('role, staff_id, business_id')
            .eq('business_id', state.biz.id)
            .eq('user_id', sess.session.user.id)
            .maybeSingle();
          if (data) {
            state.biz.role = data.role;
            state.biz.staffId = data.staff_id || null;
            if (data.role === 'worker' && data.staff_id) {
              state.settings.role = 'worker';
              state.settings.workerId = data.staff_id;
            }
            save({ silent: true });
          }
        } catch (_) {}
      }

      /** Find the business the current user belongs to (by membership row)
       *  and hydrate state.biz. Used when a known user signs in on a new
       *  device where state.biz.id is not yet set. Returns the membership
       *  row or null. */
      async function discoverMembership() {
        try {
          const c = await client();
          const { data: sess } = await c.auth.getSession();
          if (!sess?.session) return null;
          const { data } = await c.from('members')
            .select('business_id, role, staff_id, display_name')
            .eq('user_id', sess.session.user.id);
          if (!data || !data.length) return null;
          // Prefer 'owner' > 'worker' > 'pending' if the same user has multiple rows.
          const rank = (r) => r.role === 'owner' ? 0 : r.role === 'worker' ? 1 : 2;
          const row = [...data].sort((a, b) => rank(a) - rank(b))[0];
          state.biz = {
            ...state.biz,
            id: row.business_id,
            role: row.role,
            staffId: row.staff_id || null,
            lastEventId: 0,
            pendingWrites: state.biz?.pendingWrites || [],
            status: 'synced',
          };
          if (row.role === 'worker' && row.staff_id) {
            state.settings.role = 'worker';
            state.settings.workerId = row.staff_id;
          } else if (row.role === 'owner') {
            state.settings.role = 'owner';
          }
          save({ silent: true });
          return row;
        } catch { return null; }
      }

      async function listPendingMembers() {
        if (!isOwner()) return [];
        try {
          const c = await client();
          const { data, error } = await c.from('members')
            .select('user_id, display_name, joined_at, role')
            .eq('business_id', state.biz.id)
            .eq('role', 'pending');
          if (error) throw error;
          return data || [];
        } catch { return []; }
      }

      async function listAllMembers() {
        if (!active()) return [];
        try {
          const c = await client();
          const { data } = await c.from('members')
            .select('user_id, display_name, role, staff_id, joined_at')
            .eq('business_id', state.biz.id);
          return data || [];
        } catch { return []; }
      }

      async function createBusiness(name) {
        const c = await client();
        const { data: sess } = await c.auth.getSession();
        if (!sess?.session) throw new Error('biz_need_signin');
        const initialConfig = extractConfig();
        const { data, error } = await c.rpc('create_business', {
          biz_name: name, initial_config: initialConfig,
        });
        if (error) throw error;
        const row = Array.isArray(data) ? data[0] : data;
        state.biz = {
          ...state.biz,
          id: row.id, role: 'owner', ownerId: sess.session.user.id,
          staffId: null, joinCode: row.join_code, lastEventId: 0, pendingWrites: [],
          status: 'synced',
        };
        save();
        await subscribe();
        render();
        return row;
      }

      async function joinBusiness(code, displayName) {
        const c = await client();
        const { data: sess } = await c.auth.getSession();
        if (!sess?.session) throw new Error('biz_need_signin');
        const { data, error } = await c.rpc('join_business', {
          code: (code || '').trim(), display: displayName || null,
        });
        if (error) {
          if ((error.message || '').includes('invalid_code')) throw new Error('biz_invalid_code');
          throw error;
        }
        state.biz = {
          ...state.biz,
          id: data, role: 'pending', ownerId: null, staffId: null,
          joinCode: null, lastEventId: 0, pendingWrites: [], status: 'synced',
        };
        save();
        await subscribe();
        render();
        return data;
      }

      async function approveMember(userId, staffId) {
        if (!isOwner()) throw new Error('not_owner');
        const c = await client();
        const { error } = await c.rpc('approve_member', {
          biz: state.biz.id, uid: userId, assigned_staff_id: staffId,
        });
        if (error) throw error;
      }

      async function rejectMember(userId) {
        if (!isOwner()) throw new Error('not_owner');
        const c = await client();
        const { error } = await c.from('members')
          .delete().eq('business_id', state.biz.id).eq('user_id', userId);
        if (error) throw error;
      }

      async function rotateJoinCode() {
        if (!isOwner()) throw new Error('not_owner');
        const c = await client();
        const { data, error } = await c.rpc('rotate_join_code', { biz: state.biz.id });
        if (error) throw error;
        state.biz.joinCode = data;
        save();
        return data;
      }

      // Owner mints a personal invite code for one staff record. Used the
      // moment a new staff is added (auto-call) and any time the owner
      // taps "Resend invite". Re-issuing wipes the previous unclaimed
      // code so only one is ever live at a time per staff_id.
      async function createStaffInvite(staffId, displayName) {
        if (!isOwner()) throw new Error('not_owner');
        const c = await client();
        const { data, error } = await c.rpc('create_staff_invite', {
          biz: state.biz.id, p_staff_id: staffId, p_display_name: displayName || null,
        });
        if (error) throw error;
        return data; // the new code
      }

      // Owner deletes any unclaimed invite for a staff record.
      async function revokeStaffInvite(staffId) {
        if (!isOwner()) throw new Error('not_owner');
        const c = await client();
        const { data, error } = await c.rpc('revoke_staff_invite', {
          biz: state.biz.id, p_staff_id: staffId,
        });
        if (error) throw error;
        return Number(data || 0);
      }

      // Worker redeems a personal staff invite. On success the user is
      // immediately a full 'worker' member mapped to the right staff_id —
      // no manual approval needed. Returns { business_id, staff_id }.
      async function claimStaffInvite(code, displayName, phone) {
        const c = await client();
        const { data: sess } = await c.auth.getSession();
        if (!sess?.session) throw new Error('biz_need_signin');
        const cleanPhone = (phone || '').replace(/[^0-9+]/g, '') || null;
        const { data, error } = await c.rpc('claim_staff_invite', {
          p_code: (code || '').trim().toUpperCase(),
          p_display_name: displayName || null,
          p_phone: cleanPhone,
        });
        if (error) throw error;
        // The RPC returns OUT params named `out_business_id` /
        // `out_staff_id` (the unprefixed names collide with the
        // table column names inside the function body). We accept
        // either name to stay backwards-compatible with older
        // server versions still running the 2-arg signature.
        const raw = Array.isArray(data) ? data[0] : data;
        const bizId = raw?.out_business_id || raw?.business_id;
        const staffId = raw?.out_staff_id || raw?.staff_id;
        if (!bizId || !staffId) throw new Error('invalid_or_used_invite');
        state.biz = {
          ...state.biz,
          id: bizId,
          role: 'worker',
          ownerId: null,
          staffId: staffId,
          joinCode: null,
          lastEventId: 0,
          pendingWrites: [],
          status: 'synced',
        };
        state.settings.role = 'worker';
        state.settings.workerId = staffId;
        if (cleanPhone) state.cloud.phone = cleanPhone;
        save();
        return { business_id: bizId, staff_id: staffId };
      }

      // Returning worker: phone-only reconnect (no invite code needed).
      // Calls the `reconnect_worker_by_phone` RPC which finds the member
      // row by phone and re-links it to the caller's new anonymous uid.
      async function reconnectWorkerByPhone(phone) {
        const c = await client();
        const { data: sess } = await c.auth.getSession();
        if (!sess?.session) throw new Error('biz_need_signin');
        const cleanPhone = (phone || '').replace(/[^0-9+]/g, '') || null;
        if (!cleanPhone || cleanPhone.replace(/\D/g, '').length < 7) {
          throw new Error('invalid_phone');
        }
        const { data, error } = await c.rpc('reconnect_worker_by_phone', {
          p_phone: cleanPhone,
        });
        if (error) throw error;
        const raw = Array.isArray(data) ? data[0] : data;
        const bizId = raw?.out_business_id || raw?.business_id;
        const staffId = raw?.out_staff_id || raw?.staff_id;
        if (!bizId || !staffId) throw new Error('phone_not_found');
        state.biz = {
          ...state.biz,
          id: bizId,
          role: 'worker',
          ownerId: null,
          staffId: staffId,
          joinCode: null,
          lastEventId: 0,
          pendingWrites: [],
          status: 'synced',
        };
        state.settings.role = 'worker';
        state.settings.workerId = staffId;
        state.cloud.phone = cleanPhone;
        save();
        return { business_id: bizId, staff_id: staffId };
      }

      // Owner-side helper: list every invite for the current business so
      // the staff list can show "code: ABCD1234 (sent)" / "(claimed)".
      async function listStaffInvites() {
        if (!isOwner()) return [];
        const c = await client();
        const { data, error } = await c.from('staff_invites')
          .select('staff_id, code, display_name, created_at, used_at, used_by')
          .eq('business_id', state.biz.id)
          .order('created_at', { ascending: false });
        if (error) throw error;
        return data || [];
      }

      async function leaveBusiness() {
        try {
          const c = await client();
          const { data: sess } = await c.auth.getSession();
          if (sess?.session) {
            await c.from('members').delete()
              .eq('business_id', state.biz.id)
              .eq('user_id', sess.session.user.id);
          }
        } catch (_) {}
        teardown();
        state.biz = { id: null, role: null, ownerId: null, staffId: null, joinCode: null, lastEventId: 0, pendingWrites: [], status: 'idle' };
        save();
        render();
      }

      /** Called from boot(). Bootstraps the session: pull config baseline,
       *  replay any missed events, then open realtime. Cheap no-op if the
       *  user isn't signed in or no business exists. */
      async function boot() {
        if (!state.cloud?.enabled || !cloudSync.isConfigured()) return;
        try {
          const c = await client();
          const { data: sess } = await c.auth.getSession();
          if (!sess?.session) return;
          if (state.biz.id) {
            await refreshMembership();
            if (active()) {
              await pullConfig();
              await pullEventsSince(state.biz.lastEventId);
              await subscribe();
              await flushQueue();
              render();
            }
          }
        } catch (e) { setStatus('error', e.message || String(e)); }
      }

      // Owner config push is debounced via save() → scheduleConfigPush().
      window.addEventListener('online', () => { setStatus('synced'); flushQueue(); scheduleConfigPush(); });
      window.addEventListener('offline', () => setStatus('offline'));

      // Periodic queue flush (every 15s) in case Supabase was transiently down.
      flushTimer = setInterval(() => flushQueue().catch(() => {}), 15000);

      return {
        boot, subscribe, teardown,
        createBusiness, joinBusiness, approveMember, rejectMember, rotateJoinCode,
        leaveBusiness, listPendingMembers, listAllMembers, discoverMembership,
        createStaffInvite, revokeStaffInvite, claimStaffInvite, reconnectWorkerByPhone, listStaffInvites,
        emit, scheduleConfigPush, pushConfig, pullConfig, pullEventsSince,
        applyEvent, extractConfig, flushQueue,
        onStatus, currentStatus, active, isOwner,
      };
    })();
    window.__cloudBiz = cloudBiz;

    // ============== Toast / Sheet ==============
    function toast(msg) {
      const el = $('#toast');
      el.textContent = msg; el.classList.remove('hidden');
      clearTimeout(window.__toastT);
      window.__toastT = setTimeout(() => el.classList.add('hidden'), 1800);
    }
    function openSheet(html) {
      $('#sheetBody').innerHTML = html;
      $('#sheet').classList.remove('hidden');
      $('#sheetBackdrop').classList.remove('hidden');
    }
    function closeSheet() {
      $('#sheet').classList.add('hidden');
      $('#sheetBackdrop').classList.add('hidden');
    }
    $('#sheetBackdrop').addEventListener('click', closeSheet);

    // ============== Attendance constants ==============
    const ATT_COLOR = {
      P: 'bg-emerald-50 text-emerald-700 border-emerald-200',
      A: 'bg-rose-50 text-rose-700 border-rose-200',
      H: 'bg-amber-50 text-amber-700 border-amber-200',
      L: 'bg-sky-50 text-sky-700 border-sky-200',
    };
    const ATT_LABEL = (s) => t('status_' + s);

    // ============== Calculations ==============
    function monthAttendanceForStaff(staffId, ym) {
      const dim = daysInMonth(ym);
      const staff = state.staff.find(s => s.id === staffId);
      let present = 0, absent = 0, half = 0, leave = 0, otHours = 0;
      let weeklyOffs = 0, paidHolidays = 0;
      for (let d = 1; d <= dim; d++) {
        const dd = String(d).padStart(2, '0');
        const key = `${ym}-${dd}`;
        const status = state.attendance[key]?.[staffId];
        if (status === 'P') present++;
        else if (status === 'A') absent++;
        else if (status === 'H') half++;
        else if (status === 'L') leave++;
        else {
          const dow = new Date(key + 'T00:00:00').getDay();
          const hol = findHoliday(key);
          if (isWeeklyOffFor(staff, dow)) weeklyOffs++;
          else if (hol && hol.paid !== false) paidHolidays++;
        }
        otHours += Number(state.overtime[key]?.[staffId] || 0);
      }
      return { present, absent, half, leave, otHours, weeklyOffs, paidHolidays, dim };
    }

    function hourlyRateFor(staff) {
      if (staff.otRate && Number(staff.otRate) > 0) return Number(staff.otRate);
      if (staff.salaryType === 'piece') return 0;
      const wd = state.settings.workingDaysPerMonth || 26;
      if (staff.salaryType === 'daily') return ((staff.amount || 0) / 8) * 1.5;
      return (((staff.amount || 0) / wd) / 8) * 1.5;
    }

    function adjustmentsFor(staffId, ym) {
      return state.adjustments.filter(a => a.staffId === staffId && a.ym === ym);
    }

    function salaryForMonth(staff, ym) {
      const { present, half, leave, otHours, weeklyOffs, paidHolidays } = monthAttendanceForStaff(staff.id, ym);
      const autoPaid = staff.salaryType === 'daily' ? paidHolidays : (staff.salaryType === 'piece' ? 0 : (weeklyOffs + paidHolidays));
      const effectiveDays = present + (half * 0.5) + leave + autoPaid;
      let basePay, taskCount = 0;
      if (staff.salaryType === 'piece') {
        const ts = monthTasksForStaff(staff.id, ym);
        taskCount = ts.total;
        basePay = taskCount * (staff.pieceRate || staff.amount || 0);
      } else if (staff.salaryType === 'daily') {
        basePay = effectiveDays * (staff.amount || 0);
      } else {
        const perDay = (staff.amount || 0) / (state.settings.workingDaysPerMonth || 26);
        basePay = effectiveDays * perDay;
      }
      const otPay = otHours * hourlyRateFor(staff);
      const adjs = adjustmentsFor(staff.id, ym);
      let bonus = 0, advances = 0, deductions = 0, incentives = 0;
      adjs.forEach(a => {
        const n = Number(a.amount || 0);
        if (a.type === 'bonus') bonus += n;
        else if (a.type === 'advance') advances += n;
        else if (a.type === 'deduction') deductions += n;
        else if (a.type === 'incentive') incentives += n;
      });
      const loanEmi = loanEmiFor(staff.id, ym);
      const net = basePay + otPay + bonus + incentives - advances - deductions - loanEmi;
      return { basePay, otPay, otHours, bonus, incentives, advances, deductions, loanEmi, net, effectiveDays, weeklyOffs, paidHolidays, taskCount };
    }

    function monthTotals(ym) {
      let total = 0;
      const active = state.staff.filter(s => s.active !== false);
      active.forEach(s => { total += salaryForMonth(s, ym).net; });
      return { total, staffCount: active.length };
    }

      // -------- WORKER form: two modes --------
      // Default (workerHasCode=false): phone-only → returning worker reconnect.

      const wHasCode = welcomeUI.workerHasCode;
      const inviteSection = wHasCode ? `
          <div>

            <input name="joinCode" required maxlength="10" autocomplete="one-time-code"
                   class="w-full mt-1 px-3 py-3 border border-slate-200 rounded-lg text-lg font-mono uppercase tracking-[0.35em] text-center">

      const workerToggle = wHasCode

      const workerCta = wHasCode ? t('welcome_worker_continue') : t('welcome_worker_continue_signin');
      const workerForm = `
        <form id="welcomeAuthForm" class="space-y-4" data-flow="worker" data-has-code="${wHasCode ? '1' : '0'}">

      root.innerHTML = `
