    // ============== Payslip PDF & share helpers ==============
    function payslipTextSummary(s, ym, calc, att, businessName, monthLabel) {
      const lines = [
        `*${businessName}* — ${t('payslip')}`,
        monthLabel,
        `---`,
        `${s.name}${s.role ? ' (' + s.role + ')' : ''}`,
        `${t('status_P')}: ${att.present}  ${t('status_H')}: ${att.half}  ${t('status_L')}: ${att.leave}  ${t('status_A')}: ${att.absent}`,
        `${t('base_pay')}: ${fmtINR(calc.basePay)}`,
      ];
      if (calc.otPay > 0) lines.push(`${t('ot_amount')} (${calc.otHours}h): + ${fmtINR(calc.otPay)}`);
      if (calc.bonus > 0) lines.push(`${t('bonus_total')}: + ${fmtINR(calc.bonus)}`);
      if (calc.incentives > 0) lines.push(`${t('incentives_total')}: + ${fmtINR(calc.incentives)}`);
      if (calc.advances > 0) lines.push(`${t('advances_total')}: − ${fmtINR(calc.advances)}`);
      if (calc.deductions > 0) lines.push(`${t('deductions_total')}: − ${fmtINR(calc.deductions)}`);
      if (calc.loanEmi > 0) lines.push(`${t('emi_deduction')}: − ${fmtINR(calc.loanEmi)}`);
      lines.push(`---`, `*${t('net_payable')}: ${fmtINR(calc.net)}*`);
      return lines.join('\n');
    }

    function shareOnWhatsApp(phone, text) {
      const clean = (phone || '').replace(/\D/g, '');
      const url = `https://wa.me/${clean}?text=${encodeURIComponent(text)}`;
      window.open(url, '_blank');
    }

    // ============== UPI Pay Sheet (B8) ==============
    function buildUpiUrl(upi, amount, name, note) {
      const params = new URLSearchParams();
      params.set('pa', upi);
      if (name) params.set('pn', name);
      if (amount && amount > 0) params.set('am', amount.toFixed(2));
      params.set('cu', 'INR');
      if (note) params.set('tn', note);
      return `upi://pay?${params.toString()}`;
    }
    function openUpiPaySheet(s, amount, ym) {
      const upi = (s.upiId || '').trim();
      if (!upi) {
        toast(t('upi_not_set'));
        return;
      }
      const name = (s.name || '').slice(0, 40);
      const note = `${(state.business.name || 'PayBox').slice(0, 20)} ${ym}`.slice(0, 50);
      const url = buildUpiUrl(upi, amount, name, note);
      const qr = qrDataURL(url, 5) || '';
      openSheet(`
        <div class="mb-3">
          <div class="text-lg font-bold">${escapeHtml(t('pay_via_upi'))}</div>
          <div class="text-xs text-slate-500">${escapeHtml(s.name)} · ${fmtINR(amount)}</div>
        </div>
        <div class="bg-white border border-slate-200 rounded-2xl p-4 text-center">
          ${qr ? `<img src="${qr}" alt="UPI QR" class="mx-auto rounded-lg" style="max-width: 220px;">` : `<div class="text-xs text-slate-400 py-10">QR library not loaded.</div>`}
          <div class="mt-3 text-xs text-slate-500">${escapeHtml(t('upi_scan'))}</div>
          <div class="mt-1 font-mono text-sm break-all">${escapeHtml(upi)}</div>
        </div>
        <div class="grid grid-cols-2 gap-2 mt-3">
          <button id="upiCopy" class="py-3 rounded-lg border border-slate-200 font-semibold text-sm">${escapeHtml(t('copy_upi'))}</button>
          <a id="upiOpen" href="${url}" class="py-3 rounded-lg bg-indigo-600 text-white font-semibold text-sm text-center flex items-center justify-center">${escapeHtml(t('upi_pay_now'))}</a>
        </div>
        <button id="upiClose" class="w-full mt-2 py-3 rounded-lg bg-slate-100 font-semibold text-sm">${escapeHtml(t('close'))}</button>
      `);
      $('#upiCopy').addEventListener('click', () => {
        navigator.clipboard.writeText(upi).then(() => toast(t('upi_copied')));
      });
      $('#upiClose').addEventListener('click', closeSheet);
    }

    function openWorkerProfileSheet(w) {
      let pendingPhoto = null;     // base64 data URL captured this session

      const currentPhoto = () => photoRemoved ? null : (pendingPhoto || w.photo || null);

      openSheet(`

      };

      $('#workerPhotoBtn').addEventListener('click', async () => {
        const img = await pickAndCompressImage();
        if (!img) return;
        pendingPhoto = img; photoRemoved = false;
        refreshPreview();
      });
      $('#workerPhotoRm')?.addEventListener('click', () => {
        pendingPhoto = null; photoRemoved = true;
        refreshPreview();
      });
      $('#workerProfileCancel').addEventListener('click', closeSheet);

      $('#workerProfileForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const f = new FormData(e.target);
        const name = (f.get('name') || '').trim();
        const phone = (f.get('phone') || '').trim();
        if (!name) return;

        const payload = { name, phone };
        if (photoRemoved) payload.photo = null;
        else if (pendingPhoto) payload.photo = pendingPhoto;

        // Optimistically update local state too — applyEvent will be
        // called by emit() but defending against the case where cloud
        // sync is off (offline-only worker mode).
        const idx = state.staff.findIndex(s => s.id === w.id);
        if (idx !== -1) {
          state.staff[idx] = { ...state.staff[idx], ...payload };
        }

        if (cloudBiz.active && cloudBiz.active()) {
          try {
            await cloudBiz.emit('staff_update', w.id, payload);

            console.error('[profile] emit failed', err);
          }
        } else {
          save();
        }

        toast(t('worker_profile_saved'));
        closeSheet();
        render();
      });
    }

    // ============== Settings ==============
    // Shared sign-out used by Settings → Logout and Cloud sync → Sign out.
    // Tears down realtime, clears the auth session + business context, then
    // sends the user back to the welcome / login screen. Honours any
    // `?role=` URL lock so worker devices stay worker devices after logout.
    async function doLogout({ confirm: ask = true } = {}) {
      const isWorker = state.settings.role === 'worker' || state.cloud?.isAnonymous;
      const msg = isWorker ? t('logout_worker_confirm') : t('logout_confirm');
      if (ask && !confirm(msg)) return;
      try { await cloudSync.signOut(); } catch (_) {}
      try { cloudBiz.teardown(); } catch (_) {}
      state.biz = { id: null, role: null, ownerId: null, staffId: null, joinCode: null, lastEventId: 0, pendingWrites: [], status: 'idle' };
      state.settings.onboarded = false;
      // Clear worker-only fields so the welcome form starts clean.
      if (state.cloud) {
        state.cloud.isAnonymous = false;
        if (isWorker) { state.cloud.phone = ''; }
      }
      welcomeUI.workerHasCode = false;
      if (welcomeUI.lockedRole) {
        welcomeUI.step = 'auth';
        welcomeUI.role = welcomeUI.lockedRole;
        welcomeUI.mode = 'signin';
      } else {
        welcomeUI.step = 'pick'; welcomeUI.role = null; welcomeUI.mode = 'signin';
      }
      save();
      closeSheet();
      toast(t('cloud_signed_out'));
      render();
    }

          state.taskCategories.splice(Number(b.dataset.catRm), 1);
          save(); renderCatList();

        $('#saveCatsBtn')?.addEventListener('click', () => {

            <div class="grid grid-cols-2 gap-2 mt-3">

                <label class="text-xs font-semibold text-slate-600">${escapeHtml(t('password'))}</label>

      `);

      const statusEl = () => $('#cloudStatusRow');
      const setMsg = (m, tone = 'slate') => {
        const el = statusEl(); if (!el) return;
        const colors = { slate: 'text-slate-500', red: 'text-rose-600', green: 'text-emerald-700', amber: 'text-amber-700' };
        el.className = `mt-2 text-xs ${colors[tone]}`;
        el.textContent = m;
      };

      $('#cloudBack').addEventListener('click', openSettings);

      $('#cloudCfgForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const f = new FormData(e.target);
        const enabled = !!f.get('enabled');
        const url = (f.get('url') || '').trim();
        const anonKey = (f.get('anonKey') || '').trim();
        if (enabled && (!url || !anonKey)) { toast(t('cloud_need_credentials')); return; }
        if (enabled) await cloudSync.enable({ url, anonKey });
        else cloudSync.disable();
        audit(enabled ? 'cloud_enabled' : 'cloud_disabled');
        save(); toast(t('saved')); openCloudSheet();

      $('#cloudSignOut')?.addEventListener('click', () => doLogout());

        setMsg(t('cloud_syncing'));

        catch (err) { setMsg((err && err.message) || String(err), 'red'); }

      $('#cloudPullOnly')?.addEventListener('click', async () => {
        setMsg(t('cloud_syncing'));
        try { await cloudSync.pull(); setMsg(t('cloud_status_synced'), 'green'); openCloudSheet(); }
        catch (err) { setMsg((err && err.message) || String(err), 'red'); }

          const f = new FormData(e.target);

          const pwd = (f.get('password') || '').trim();
          if (!email || !pwd) { setMsg(t('cloud_need_email_pwd'), 'red'); return; }
          setMsg(t('cloud_signing_in'));
          try { await cloudSync.signInWithPassword(email, pwd); toast(t('cloud_signed_in')); openCloudSheet(); }
          catch (err) { setMsg((err && err.message) || String(err), 'red'); }
        });
        $('#cloudSignUpBtn').addEventListener('click', async () => {
          const email = (authForm.email?.value || '').trim();
          const pwd   = (authForm.password?.value || '').trim();
          if (!email || !pwd) { setMsg(t('cloud_need_email_pwd'), 'red'); return; }
          setMsg(t('cloud_signing_up'));
          try { await cloudSync.signUp(email, pwd); setMsg(t('cloud_signup_check_email'), 'amber'); }
          catch (err) { setMsg((err && err.message) || String(err), 'red'); }
        });
        $('#cloudMagicBtn').addEventListener('click', async () => {
          const email = (authForm.email?.value || '').trim();
          if (!email) { setMsg(t('cloud_need_email'), 'red'); return; }
          setMsg(t('cloud_sending_magic'));
          try { await cloudSync.sendMagicLink(email); setMsg(t('cloud_magic_sent'), 'amber'); }
          catch (err) { setMsg((err && err.message) || String(err), 'red'); }
        });
      }

      wireBizHandlers();
    }

    // Build the URL the owner can hand to staff. Workers visiting it
    // skip the role picker and land directly on the worker sign-in.
    // Falls back to the current host if origin isn't available.
    function buildWorkerUrl() {
      try {
        const u = new URL('worker.html', location.href);
        return u.toString();
      } catch {
        return 'worker.html';
      }
    }

    function wireBizHandlers() {
      $('#bizCreateBtn')?.addEventListener('click', openCreateBusinessSheet);
      $('#bizJoinBtn')?.addEventListener('click', openJoinBusinessSheet);
      $('#bizAdminBtn')?.addEventListener('click', openBusinessAdminSheet);
      $('#bizWorkerUrlCopy')?.addEventListener('click', async () => {
        const url = buildWorkerUrl();
        try {
          await navigator.clipboard.writeText(url);
          toast(t('cloud_worker_url_copied'));
        } catch {
          // Fallback: select the code element so the user can copy manually.
          const el = $('#bizWorkerUrl');
          if (el) {
            const r = document.createRange(); r.selectNodeContents(el);
            const s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
            toast(t('cloud_worker_url_copied'));
          }
        }
      });
      $('#bizWorkerUrlShare')?.addEventListener('click', async () => {
        const url = buildWorkerUrl();
        const code = state.biz?.joinCode || '';
        const bizName = state.business?.name || 'PayBox';
        const text = `${bizName} — Staff sign-in\n\n1) Open: ${url}\n2) Sign up with your email + password\n3) Use join code: ${code}`;
        if (navigator.share) {
          try { await navigator.share({ title: `${bizName} — Staff sign-in`, text, url }); return; } catch {}
        }
        try { await navigator.clipboard.writeText(text); toast(t('cloud_worker_url_copied')); }
        catch { /* noop */ }
      });
      $('#bizRotateBtn')?.addEventListener('click', async () => {
        if (!confirm(t('biz_rotate_code') + '?')) return;
        try { await cloudBiz.rotateJoinCode(); toast(t('biz_code_rotated')); openCloudSheet(); }
        catch (e) { toast(e.message || String(e)); }
      });
      $('#bizLeaveBtn')?.addEventListener('click', async () => {
        if (!confirm(t('biz_leave_confirm'))) return;
        await cloudBiz.leaveBusiness();
        toast(t('biz_left'));
        openCloudSheet();
      });
    }

    async function refreshBizAdminLists() {
      const pending = await cloudBiz.listPendingMembers();
      const all = await cloudBiz.listAllMembers();
      const pendEl = $('#bizPendingList');
      const memEl = $('#bizMembersList');
      if (!pendEl || !memEl) return;
      const staffOpts = (selected) => state.staff.filter(s => s.active !== false).map(s => `<option value="${escapeHtml(s.id)}" ${selected === s.id ? 'selected' : ''}>${escapeHtml(s.name)}${s.role ? ' · ' + escapeHtml(s.role) : ''}</option>`).join('');
      pendEl.innerHTML = pending.length
        ? pending.map(m => `
          <div class="rounded-lg border border-amber-200 bg-amber-50 p-2.5">
            <div class="text-sm font-semibold">${escapeHtml(m.display_name || m.user_id.slice(0, 8) + '…')}</div>
            <div class="mt-1.5 flex gap-2 items-center">
              <select data-approve-uid="${escapeHtml(m.user_id)}" class="flex-1 px-2 py-1.5 text-xs border border-slate-200 rounded-md bg-white">
                <option value="">${escapeHtml(t('biz_approve_as'))}…</option>
                ${staffOpts('')}
              </select>
              <button type="button" data-approve-go="${escapeHtml(m.user_id)}" class="text-xs font-semibold px-2.5 py-1.5 rounded-md bg-emerald-600 text-white">${escapeHtml(t('biz_approve'))}</button>
              <button type="button" data-reject="${escapeHtml(m.user_id)}" class="text-xs font-semibold px-2.5 py-1.5 rounded-md border border-rose-200 text-rose-700">${escapeHtml(t('biz_reject'))}</button>
            </div>
          </div>`).join('')
        : `<div class="text-xs text-slate-400">${escapeHtml(t('biz_no_pending'))}</div>`;

      memEl.innerHTML = all.filter(m => m.role !== 'pending').map(m => {
        const staff = state.staff.find(s => s.id === m.staff_id);
        const label = m.role === 'owner' ? t('biz_you_are_owner').replace('You are the ', '') : (staff ? staff.name : (m.display_name || m.user_id.slice(0, 8) + '…'));
        return `
          <div class="flex items-center gap-2 bg-white border border-slate-100 rounded-lg p-2.5">
            <div class="flex-1 min-w-0">
              <div class="text-sm font-semibold truncate">${escapeHtml(label)}</div>
              <div class="text-[11px] text-slate-500">${escapeHtml(m.role)}${staff ? ' · ' + escapeHtml(staff.role || '') : ''}</div>
            </div>
            ${m.role === 'worker' ? `<button type="button" data-remove="${escapeHtml(m.user_id)}" class="text-xs font-semibold px-2 py-1 rounded-md border border-rose-200 text-rose-700">${escapeHtml(t('remove'))}</button>` : ''}
          </div>`;
      }).join('') || `<div class="text-xs text-slate-400">—</div>`;

      $$('[data-approve-go]').forEach(b => b.addEventListener('click', async () => {
        const uid = b.dataset.approveGo;
        const sel = pendEl.querySelector(`[data-approve-uid="${uid}"]`);
        const sid = sel?.value;
        if (!sid) { toast(t('biz_approve_as') + '…'); return; }
        try { await cloudBiz.approveMember(uid, sid); toast(t('biz_approved')); refreshBizAdminLists(); }
        catch (e) { toast(e.message || String(e)); }
      }));
      $$('[data-reject]').forEach(b => b.addEventListener('click', async () => {
        try { await cloudBiz.rejectMember(b.dataset.reject); toast(t('biz_rejected')); refreshBizAdminLists(); }
        catch (e) { toast(e.message || String(e)); }
      }));
      $$('[data-remove]').forEach(b => b.addEventListener('click', async () => {
        if (!confirm('Remove?')) return;
        try { await cloudBiz.rejectMember(b.dataset.remove); toast(t('biz_rejected')); refreshBizAdminLists(); }
        catch (e) { toast(e.message || String(e)); }
      }));
    }

        state.announcements = state.announcements.filter(a => a.id !== b.dataset.annDel);
        audit('announcement_removed', { id: b.dataset.annDel });
        save(); toast(t('ann_removed')); openAnnouncements();
      }));
      $$('[data-ann-read]').forEach(b => b.addEventListener('click', () => {
        const a = state.announcements.find(x => x.id === b.dataset.annRead);

        a.readBy = a.readBy || [];

        save(); openAnnouncements();
      }));

      const unreadForWorker = workerId && !(a.readBy || []).includes(workerId);
      return `
        <div class="bg-white border border-slate-100 rounded-xl p-3 shadow-soft">

                <span class="font-semibold text-sm">${escapeHtml(a.title || '')}</span>
                ${unreadForWorker ? `<span class="chip bg-rose-50 text-rose-700">${escapeHtml(t('unread_label'))}</span>` : ''}
              </div>
              <div class="text-xs text-slate-500 mt-0.5">${escapeHtml(new Date(a.createdAt || '').toLocaleString())} · ${(a.readBy || []).length} ${escapeHtml(t('read_label'))}</div>
              <div class="text-sm text-slate-700 mt-2 whitespace-pre-wrap">${escapeHtml(a.body || '')}</div>
            </div>
          </div>
          <div class="flex gap-2 mt-2">
            ${unreadForWorker ? `<button data-ann-read="${a.id}" class="flex-1 py-2 rounded-lg bg-emerald-50 border border-emerald-200 text-emerald-700 text-xs font-semibold">${escapeHtml(t('mark_read'))}</button>` : ''}
            ${isOwner ? `<button data-ann-del="${a.id}" class="flex-1 py-2 rounded-lg border border-rose-200 text-rose-600 text-xs font-semibold">${escapeHtml(t('remove'))}</button>` : ''}
          </div>
        </div>`;
    }

    async function pinGate() {
      if (!state.settings.pinEnabled || !state.settings.pinHash) return true;
      const _pinKey = _urlRole ? `paybox_unlocked_${_urlRole}` : 'paybox_unlocked';
      if (sessionStorage.getItem(_pinKey) === '1') return true;
      return new Promise((resolve) => {
        const overlay = document.createElement('div');
        overlay.className = 'fixed inset-0 bg-slate-900/95 backdrop-blur-sm z-[100] flex items-center justify-center p-6';
        overlay.innerHTML = `
          <form id="pinGateForm" class="bg-white rounded-2xl p-6 w-full max-w-sm">

              <div class="w-14 h-14 mx-auto rounded-full bg-brand-50 text-brand-600 flex items-center justify-center mb-2">

              </div>
              <div class="text-lg font-bold">PayBox</div>
              <div class="text-xs text-slate-500">${escapeHtml(t('pin_enter'))}</div>
            </div>
            <input name="pin" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" required class="w-full px-3 py-3 border border-slate-200 rounded-lg text-center text-2xl tracking-[0.6em] font-bold" autofocus>
            <button type="submit" class="w-full mt-3 py-3 rounded-lg bg-brand-600 text-white font-semibold text-sm">${escapeHtml(t('pin_enter'))}</button>
            <button type="button" id="pinForgot" class="w-full mt-2 text-xs text-slate-500">${escapeHtml(t('forgot_pin'))}</button>
          </form>`;
        document.body.appendChild(overlay);
        overlay.querySelector('#pinGateForm').addEventListener('submit', async (e) => {
          e.preventDefault();
          const f = new FormData(e.target);
          const pin = (f.get('pin') || '').trim();
          const h = await sha256Hex(pin);
          if (h === state.settings.pinHash) {
            sessionStorage.setItem(_pinKey, '1');
            overlay.remove();
            resolve(true);
          } else {
            toast(t('pin_wrong'));
            e.target.querySelector('input[name="pin"]').value = '';

          state = load();
          overlay.remove();
          resolve(true);
          render();
        });
      });
    }

    function exportAttendanceCSV(ym) {
      const dim = daysInMonth(ym);
      const header = ['Name', 'Code', 'Role'];
      for (let d = 1; d <= dim; d++) header.push(String(d).padStart(2, '0'));
      header.push('P', 'A', 'H', 'L', 'OT(h)', 'WO', 'HOL');
      const rows = [header];
      state.staff.forEach(s => {
        const row = [s.name, s.empCode || '', s.role || ''];
        for (let d = 1; d <= dim; d++) {
          const key = `${ym}-${String(d).padStart(2, '0')}`;
          const st = state.attendance[key]?.[s.id];
          if (st) row.push(st);
          else {
            const dow = new Date(key + 'T00:00:00').getDay();
            if (isWeeklyOffFor(s, dow)) row.push('WO');
            else if (findHoliday(key)) row.push('HOL');
            else row.push('');
          }
        }
        const m = monthAttendanceForStaff(s.id, ym);
        row.push(m.present, m.absent, m.half, m.leave, m.otHours, m.weeklyOffs, m.paidHolidays);
        rows.push(row);
      });
      downloadCSV(`paybox-attendance-${ym}.csv`, buildCSV(rows));
      audit('csv_attendance_exported', { ym });
    }
    function exportPayrollCSV(ym) {

        'Effective days', 'Base pay', 'OT pay', 'Bonus', 'Incentive', 'Advance', 'Deduction', 'Loan EMI', 'Net payable'];

    // ============== Excel Export ==============
    // SheetJS is loaded lazily on first export so the app stays light and
    // works offline for everything except this one feature. If the CDN is
    // unreachable we fall back to a JSON backup so data is never lost.
    let _sheetJsP = null;
    function loadSheetJS() {
      if (window.XLSX) return Promise.resolve(window.XLSX);
      if (_sheetJsP) return _sheetJsP;
      _sheetJsP = new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
        s.crossOrigin = 'anonymous';
        s.onload = () => window.XLSX ? resolve(window.XLSX) : reject(new Error('sheetjs_no_global'));
        s.onerror = () => { _sheetJsP = null; reject(new Error('sheetjs_load_failed')); };
        document.head.appendChild(s);
      });
      return _sheetJsP;
    }

    function buildWorkbook(XLSX) {
      const wb = XLSX.utils.book_new();
      const ym = state.currentPayrollMonth;
      const dim = daysInMonth(ym);
      const nameById = Object.fromEntries(state.staff.map(s => [s.id, s.name]));
      const dateInMonth = (d) => d.startsWith(ym + '-');
      const addSheet = (name, rows, fallback) => {
        const data = rows && rows.length ? rows : [fallback];
        XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(data), name);
      };

      // --- Staff master list ---
      addSheet('Staff', state.staff.map(s => ({
        Name: s.name || '',
        Code: s.empCode || '',
        Role: s.role || '',
        Phone: s.phone || '',
        UPI: s.upiId || '',
        'Salary Type': s.salaryType || '',
        Rate: s.salaryType === 'piece' ? (s.pieceRate || s.amount || '') : (s.amount ?? ''),
        'Piece Rate': s.pieceRate || '',
        Status: (s.active !== false) ? 'Active' : 'Ex-Employee',
        'Join Date': s.joinDate || s.joinedAt || '',
        'Exit Date': s.exitDate || '',
      })), { Name: '(no staff)' });

      // --- Attendance grid (one row per employee, columns = days) ---
      const attHeader = ['Name', 'Code', 'Role'];
      for (let d = 1; d <= dim; d++) attHeader.push(String(d).padStart(2, '0'));
      attHeader.push('P', 'A', 'H', 'L', 'WO', 'HOL', 'OT(h)');
      const attGrid = [attHeader];
      state.staff.forEach(s => {
        const row = [s.name, s.empCode || '', s.role || ''];
        for (let d = 1; d <= dim; d++) {
          const key = `${ym}-${String(d).padStart(2, '0')}`;
          const st = state.attendance[key]?.[s.id];
          if (st) row.push(st);
          else {
            const dow = new Date(key + 'T00:00:00').getDay();
            if (isWeeklyOffFor(s, dow)) row.push('WO');
            else if (findHoliday(key)) row.push('HOL');
            else row.push('');
          }
        }
        const m = monthAttendanceForStaff(s.id, ym);
        row.push(m.present, m.absent, m.half, m.leave, m.weeklyOffs, m.paidHolidays, m.otHours);
        attGrid.push(row);
      });
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(attGrid), `Attendance ${ym}`);

      // --- Punches for selected month ---
      const punchRows = [];
      Object.entries(state.punches || {}).forEach(([date, perStaff]) => {
        if (!dateInMonth(date)) return;
        Object.entries(perStaff || {}).forEach(([sid, p]) => {
          punchRows.push({
            Date: date,
            Name: nameById[sid] || sid,
            'In': p.in || '',
            'Out': p.out || '',
            'In At': p.inAt || '',
            'Out At': p.outAt || '',
            'In Lat': p.inLat ?? '',
            'In Lng': p.inLng ?? '',
            'In Acc (m)': p.inLocAcc ?? '',
            'Out Lat': p.outLat ?? '',
            'Out Lng': p.outLng ?? '',
            'Out Acc (m)': p.outLocAcc ?? '',
          });
        });
      });
      punchRows.sort((a, b) => a.Date.localeCompare(b.Date) || a.Name.localeCompare(b.Name));
      addSheet(`Punches ${ym}`, punchRows, { Date: '', Name: '(no punches)' });

      // --- Payroll for selected month ---
      let totalNet = 0;
      const payRows = state.staff.map(s => {
        const c = salaryForMonth(s, ym);
        totalNet += c.net;
        return {
          Name: s.name,
          Code: s.empCode || '',
          Role: s.role || '',
          Phone: s.phone || '',
          UPI: s.upiId || '',
          'Salary Type': s.salaryType,
          Rate: s.salaryType === 'piece' ? (s.pieceRate || s.amount) : s.amount,
          'Task Count': c.taskCount || '',
          'Effective Days': +c.effectiveDays.toFixed(2),
          'Base Pay': Math.round(c.basePay),
          'OT Pay': Math.round(c.otPay),
          Bonus: Math.round(c.bonus),
          Incentive: Math.round(c.incentives || 0),
          Advance: Math.round(c.advances),
          Deduction: Math.round(c.deductions),
          'Loan EMI': Math.round(c.loanEmi || 0),
          'Net Payable': Math.round(c.net),
        };
      });
      if (payRows.length) {
        payRows.push({ Name: 'TOTAL', 'Net Payable': Math.round(totalNet) });
      }
      addSheet(`Payroll ${ym}`, payRows, { Name: '(no staff)' });

      // --- Adjustments for selected month ---
      const adjRows = (state.adjustments || []).filter(a => a.ym === ym).map(a => ({
        'Staff ID': a.staffId,
        Name: nameById[a.staffId] || a.staffId,
        Type: a.type,
        Amount: a.amount,
        Note: a.note || '',
        'Created At': a.createdAt ? new Date(a.createdAt).toISOString() : '',
      }));
      addSheet(`Adjustments ${ym}`, adjRows, { Name: '(no adjustments)' });

      // --- Tasks grid (one row per employee, columns = days) ---
      const cats = state.taskCategories || [];
      const taskHeader = ['Name', 'Code', 'Role'];
      for (let d = 1; d <= dim; d++) taskHeader.push(String(d).padStart(2, '0'));
      cats.forEach(c => taskHeader.push(c));
      taskHeader.push('Total', 'Avg', 'Man Days');
      const taskGrid = [taskHeader];
      state.staff.forEach(s => {
        const row = [s.name, s.empCode || '', s.role || ''];
        const ms = monthTasksForStaff(s.id, ym);
        for (let d = 1; d <= dim; d++) {
          const key = `${ym}-${String(d).padStart(2, '0')}`;
          const entry = state.taskLog[key]?.[s.id];
          row.push(entry?.total || 0);
        }
        cats.forEach(c => row.push(ms.catTotals[c] || 0));
        row.push(ms.total, ms.avg, ms.manDays);
        taskGrid.push(row);
      });
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(taskGrid), `Tasks ${ym}`);

      addSheet('Loans', (state.loans || []).map(l => ({
        'Staff ID': l.staffId,
        Name: nameById[l.staffId] || l.staffId,
        Principal: l.principal,
        EMI: l.emi,
        'Start Month': l.startYm,
        Note: l.note || '',
        Closed: l.closed ? 'Yes' : 'No',
      })), { 'Staff ID': '', Name: '(no loans)' });

      addSheet('Holidays', (state.holidays || []).map(h => ({
        Date: h.date,
        Name: h.name,
        Paid: h.paid ? 'Yes' : 'No',
      })), { Date: '', Name: '(no holidays)' });

      const settingsAoa = [
        ['Setting', 'Value'],
        ['Period', ym],
        ['Business name', state.business?.name || ''],
        ['Business address', state.business?.address || ''],
        ['Business UPI', state.business?.upi || ''],
        ['Working days per month', state.settings?.workingDaysPerMonth ?? 26],
        ['Exported at', new Date().toISOString()],
        ['App', 'PayBox'],
      ];
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(settingsAoa), 'Settings');

      return wb;
    }

    async function exportExcel() {
      let toastMsg = t('excel_preparing');
      try { toast(toastMsg); } catch {}
      try {
        const XLSX = await loadSheetJS();
        const wb = buildWorkbook(XLSX);
        const wbout = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
        const blob = new Blob([wbout], {
          type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
        });
        const filename = `paybox-${state.currentPayrollMonth}.xlsx`;
        if (window.Native?.writeFile) {
          const b64 = await new Promise((res, rej) => {
            const r = new FileReader();
            r.onload = () => res(String(r.result).split(',')[1] || '');
            r.onerror = () => rej(r.error);
            r.readAsDataURL(blob);
          });
          const wrote = await Native.writeFile({
            name: filename,
            data: b64,
            mimeType: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
          });
          if (wrote) {
            toast(t('excel_downloaded'));
            audit('excel_exported', { filename });
            return;
          }
        }
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        a.click();
        URL.revokeObjectURL(url);
        toast(t('excel_downloaded'));
        audit('excel_exported', { filename });
      } catch (err) {
        console.error('[excel]', err);
        toast(t('excel_failed_fallback_json'));
        exportData();
      }
    }

    // ============== Export (JSON fallback) ==============
    function exportData() {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `paybox-backup-${todayISO()}.json`; a.click();
      URL.revokeObjectURL(url);
      toast(t('backup_downloaded'));
    }

    // ============== Delegated clicks ==============
    document.addEventListener('click', (e) => {
      const row = e.target.closest('[data-staff-open]');
      if (row) openStaffForm(row.dataset.staffOpen);
    });

    // ============== PWA ==============
    // Register the service worker only in the browser. Native shells
    // (Capacitor iOS/Android) already ship with assets bundled inside
    // the app, and running an extra SW inside a WKWebView / WebView is
    // both unnecessary and flaky across OS versions.
    if (!Native.on && 'serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }

    // ============== Native: back button + deep links ==============
    // Android hardware back should close an open sheet first and only
    // exit the app if nothing to close.
    if (Native.on) {
      Native.onBack(() => {
        const sheet = document.getElementById('sheet');
        if (sheet && !sheet.classList.contains('hidden')) {
          try { closeSheet(); } catch (_) {}
          return;
        }
        // Settings / backdrop fall through the same path.
        const backdrop = document.getElementById('sheetBackdrop');
        if (backdrop && !backdrop.classList.contains('hidden')) {
          try { closeSheet(); } catch (_) {}
          return;
        }
        const App = Native.plugin('App');
        if (App && App.exitApp) { try { App.exitApp(); } catch (_) {} }
      });

      // Supabase magic links return via a deep link like
      // `capacitor://localhost/#access_token=...`. Forward the URL into
      // the current location so supabase-js picks it up on next boot.
      Native.onAppUrlOpen((ev) => {
        try {
          const url = ev && ev.url ? String(ev.url) : '';
          if (!url) return;
          const hashIdx = url.indexOf('#');
          if (hashIdx !== -1) {
            const hash = url.slice(hashIdx);
            location.hash = hash;
            // Supabase boot() auto-pulls once the session is restored.
            try { if (typeof cloudSync !== 'undefined') cloudSync.boot(); } catch (_) {}
            try { if (typeof cloudBiz !== 'undefined') cloudBiz.boot(); } catch (_) {}
          }
        } catch (_) {}
      });
    }

    let deferredInstall = null;
    // The "Install" chip only makes sense in a mobile browser — we
    // suppress it entirely inside a native Capacitor shell (the app
    // is already installed) and when the page is already standalone.
    if (!Native.on) {
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault(); deferredInstall = e;
        $('#installPrompt').classList.remove('hidden');
      });
      $('#installBtn').addEventListener('click', async () => {
        $('#installPrompt').classList.add('hidden');
        if (deferredInstall) { deferredInstall.prompt(); deferredInstall = null; }
      });
      $('#installDismiss').addEventListener('click', () => $('#installPrompt').classList.add('hidden'));
    }

    // Once the first paint is done, tell @capacitor/splash-screen to
    // hide if it's still showing. This is redundant with the auto-hide
    // timeout in capacitor.config.ts but keeps the splash snappy on
    // slow devices.
    if (Native.on) {
      window.addEventListener('load', () => {
        try {
          const Splash = Native.plugin('SplashScreen');
          if (Splash && Splash.hide) Splash.hide({ fadeOutDuration: 200 });
        } catch (_) {}
        try {
          const StatusBar = Native.plugin('StatusBar');
          if (StatusBar && StatusBar.setStyle) StatusBar.setStyle({ style: 'LIGHT' });
          if (StatusBar && StatusBar.setBackgroundColor) StatusBar.setBackgroundColor({ color: '#2b43ec' });
        } catch (_) {}
      });
    }

    // ============== Init ==============
    (async () => {
      // Native hydrate: if running inside Capacitor and localStorage is
      // empty (fresh install or OS purged WebView storage), try to
      // recover the last saved state from @capacitor/preferences.
      if (Native.on) {
        try {
          const localRaw = localStorage.getItem(LS_KEY);
          const isEmpty = !localRaw
            || (!state.staff?.length && !Object.keys(state.attendance || {}).length);
          if (isEmpty) {
            const prefRaw = await Native.kvGet(LS_KEY);
            if (prefRaw) {
              localStorage.setItem(LS_KEY, prefRaw);
              state = load();
            }
          }
        } catch (_) { /* best-effort */ }
      }

      // Convenience for demos: `?demo=1` loads the sample dataset.
      // `?demo=force` overwrites even an existing state.
      try {
        const params = new URLSearchParams(location.search);
        const demo = params.get('demo');
        if (demo) {
          const empty = !state.staff?.length && !Object.keys(state.attendance || {}).length;
          if (demo === 'force' || empty) {
            state = generateDemoData();
            save();
            // Strip the param so reloads don't keep overwriting after the
            // user explores the app.
            params.delete('demo');
            const next = location.pathname + (params.toString() ? '?' + params.toString() : '');
            try { history.replaceState(null, '', next); } catch (_) {}
          }
        }
      } catch (_) { /* best-effort */ }
      await pinGate();
      render();
      // Non-blocking cloud hydrate — pulls fresh data and opens a realtime
      // channel without delaying the first paint.
      cloudSync.boot();
      cloudBiz.boot();

      // Push notification setup — owners only, native shells only.
      // Requests permission, registers with FCM/APNs, and upserts the
      // device token into the push_tokens table so the Edge Function
      // can deliver notifications when workers punch in/out.
      initPushNotifications();
    })();

    async function initPushNotifications() {
      if (!Native.pushAvailable()) return;
      if (!state.settings.onboarded || state.settings.role !== 'owner') return;
      if (!state.biz?.id || !cloudSync.isConfigured()) return;

      const granted = await Native.pushRequestPermission();
      if (!granted) return;

      Native.onPushRegistration(async (token) => {
        if (!token?.value) return;
        try {
          const c = await cloudSync.ensureClient();
          const { data: sess } = await c.auth.getSession();
          if (!sess?.session) return;
          await c.from('push_tokens').upsert({
            user_id: sess.session.user.id,
            business_id: state.biz.id,
            token: token.value,
            platform: Native.platform,
          }, { onConflict: 'user_id,token' });
        } catch (e) { console.warn('[push] token save failed:', e); }
      });

      Native.onPushReceived((notification) => {
        if (notification?.title || notification?.body) {
          toast(notification.body || notification.title);
        }
      });

      Native.onPushAction((action) => {
        const data = action?.notification?.data;
        if (data?.tab) {
          state.currentTab = data.tab;
          save({ silent: true });
          render();
        }
      });

      await Native.pushRegister();
    }
  </script>
</body>
</html>
