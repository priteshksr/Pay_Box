name: Android build

# Builds a debug APK on every push + PR (always, no secrets required).
# If the four ANDROID_KEYSTORE_* secrets are set, ALSO builds a signed
# release AAB you can upload straight to Play Console.
#
# Trigger manually from the Actions tab ("Run workflow") or automatically
# when you push to main / tag a release.
#
# See NATIVE_CI.md for the one-time secrets setup.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build APK + AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: native/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Capacitor + plugins
        working-directory: native
        run: npm ci

      - name: Sync web assets into native/www/
        working-directory: native
        run: npm run build

      - name: Capacitor sync (generate native bridge files)
        working-directory: native
        run: npx cap sync android --no-build

      # --- Debug APK (always, no secrets needed) ---------------------
      - name: Build debug APK
        working-directory: native/android
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: paybox-debug-apk
          path: native/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      # --- Release AAB (only if keystore secrets are configured) -----
      # The keystore is committed to the repo as a base64 secret, not
      # a file. GitHub runners decode it just-in-time, use it for this
      # run only, then the runner is destroyed.
      - name: Decode release keystore
        id: keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > native/release.jks
          echo "Decoded keystore to native/release.jks ($(stat -c%s native/release.jks) bytes)"
          echo "has_keystore=true" >> "$GITHUB_OUTPUT"

      - name: Write keystore.properties
        if: steps.keystore.outputs.has_keystore == 'true'
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_STORE_PASSWORD }}
          KEY_ALIAS:      ${{ secrets.ANDROID_KEYSTORE_KEY_ALIAS }}
          KEY_PASSWORD:   ${{ secrets.ANDROID_KEYSTORE_KEY_PASSWORD }}
        run: |
          cat > native/android/keystore.properties <<EOF
          storeFile=../../release.jks
          storePassword=${STORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF

      - name: Build signed release AAB
        if: steps.keystore.outputs.has_keystore == 'true'
        working-directory: native/android
        run: ./gradlew --no-daemon bundleRelease

      - name: Upload release AAB
        if: steps.keystore.outputs.has_keystore == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: paybox-release-aab
          path: native/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 90

      - name: Clean up keystore
        if: always()
        run: rm -f native/release.jks native/android/keystore.properties
