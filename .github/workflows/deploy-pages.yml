name: Deploy PayBox PWA to GitHub Pages

# Static-site deploy for PayBox. Use this workflow when My_Box/ is the
# root of its own git repo. (There's also an equivalent copy one level
# up at ../../.github/workflows/ for monorepo setups.)

on:
  push:
    branches: [main]
    # Skip the web test+deploy pipeline for commits that can't affect the
    # published PWA (native shell, DB migrations, docs).
    paths-ignore:
      - 'native/**'
      - 'supabase/**'
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # ── Smoke tests: fast, stable critical paths (app boots, worker punch,
  #    manifest/SW/CSS reachable). These GATE the deploy — if they fail the
  #    site really is broken and we should not publish.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - name: Install dependencies
        working-directory: tests
        run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('tests/package-lock.json') }}
      - name: Install Playwright browsers
        working-directory: tests
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install chromium --with-deps
          fi
      - name: Run smoke tests
        working-directory: tests
        run: npx playwright test smoke.spec.js

  # ── Full suite: runs independently for visibility. It does NOT gate the
  #    deploy, so a flaky/non-critical failure can no longer silently block
  #    publishing — but a failure still turns the run red and files an issue
  #    (see the `notify` job below).
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - name: Install dependencies
        working-directory: tests
        run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('tests/package-lock.json') }}
      - name: Install Playwright browsers
        working-directory: tests
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install chromium --with-deps
          fi
      - name: Run full test suite
        working-directory: tests
        run: npx playwright test
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/playwright-report/
          retention-days: 14

  deploy:
    # Gate publishing on the smoke tests only — the full suite is non-blocking.
    needs: smoke
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build Tailwind CSS
        run: npm run build:css
      - uses: actions/configure-pages@v5
      - name: Auto-version service worker cache
        run: |
          HASH=$(git rev-parse --short HEAD)
          sed -i "s/paybox-v[0-9]*/paybox-${HASH}/" sw.js
      - name: Prepare publish directory
        run: |
          mkdir -p _site
          rsync -a --exclude 'tests' --exclude 'native' --exclude 'scripts/node_modules' \
                --exclude '.github' --exclude '_site' \
                ./ _site/
          ls -la _site
          ls -la _site/.well-known || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

  # ── Make failures loud, never silent: if smoke or the full suite fails,
  #    open (or comment on) a tracking issue so a broken pipeline can't go
  #    unnoticed the way it did before.
  notify:
    needs: [smoke, test, deploy]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        env:
          SMOKE_RESULT: ${{ needs.smoke.result }}
          TEST_RESULT: ${{ needs.test.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        with:
          script: |
            const smoke = process.env.SMOKE_RESULT;
            const test = process.env.TEST_RESULT;
            const deploy = process.env.DEPLOY_RESULT;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const deployNote = smoke === 'failure'
              ? '⛔ Smoke tests failed — **the deploy was blocked**. The live site is stale until this is fixed.'
              : '✅ Smoke tests passed, so the site still deployed. The full test suite failed and needs attention (non-blocking).';
            const body = [
              `CI failed on \`main\` at commit ${context.sha.slice(0, 7)}.`,
              '',
              `- Smoke tests: **${smoke}**`,
              `- Full suite: **${test}**`,
              `- Deploy: **${deploy}**`,
              `- Run: ${runUrl}`,
              '',
              deployNote,
            ].join('\n');
            const title = 'CI failing on main';
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'ci-failure',
            });
            if (open.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: open[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['ci-failure'],
              });
            }
