name: Deploy PayBox PWA to GitHub Pages

# Static-site deploy for PayBox. Use this workflow when My_Box/ is the
# root of its own git repo. (There's also an equivalent copy one level
# up at ../../.github/workflows/ for monorepo setups.)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare publish directory
        run: |
          mkdir -p _site
          rsync -a --exclude 'tests' --exclude 'native' --exclude 'scripts/node_modules' \
                --exclude '.github' --exclude '_site' \
                ./ _site/
          ls -la _site
          ls -la _site/.well-known || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
