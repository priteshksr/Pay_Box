name: Deploy PayBox PWA to GitHub Pages

# Static-site deploy for PayBox. Use this workflow when My_Box/ is the
# root of its own git repo. (There's also an equivalent copy one level
# up at ../../.github/workflows/ for monorepo setups.)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - name: Install dependencies
        working-directory: tests
        run: npm ci
      - name: Install Playwright browsers
        working-directory: tests
        run: npx playwright install chromium --with-deps
      - name: Run tests
        working-directory: tests
        run: npx playwright test
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/playwright-report/
          retention-days: 14

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build Tailwind CSS
        run: npm run build:css
      - uses: actions/configure-pages@v5
      - name: Auto-version service worker cache
        run: |
          HASH=$(git rev-parse --short HEAD)
          sed -i "s/paybox-v[0-9]*/paybox-${HASH}/" sw.js
      - name: Prepare publish directory
        run: |
          mkdir -p _site
          rsync -a --exclude 'tests' --exclude 'native' --exclude 'scripts/node_modules' \
                --exclude '.github' --exclude '_site' \
                ./ _site/
          ls -la _site
          ls -la _site/.well-known || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
